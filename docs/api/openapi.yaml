openapi: 3.1.0

info:
  title: Radha Krishna Thakurbari API
  version: 0.6.0
  description: |
    REST/JSON API for the Radha Krishna Thakurbari Flutter Web public site and
    admin console.

    **Scope: Phases 0-5.** Endpoints for donations, enquiries,
    announcements, accounts and reports are added in their own phases and must
    be documented here in the same change that implements them.

    ## Authorization

    Admin endpoints require an authenticated, active account **and** a
    permission key from the matrix (`module.action`, e.g. `users.manage`).
    `GET /api/auth/me` returns the caller's effective keys so the client can
    hide what would be refused — a courtesy only. Every request is authorized
    again on the server.

    Super Admin passes every check and its permission set cannot be edited, so
    no change to the matrix can leave the temple without an administrator.

    ## Bilingual content

    Public content endpoints take `?lang=hi|en` and answer with resolved text
    blocks rather than raw columns:

    ```json
    { "value": "…", "language": "hi", "fallback_used": true }
    ```

    Hindi is the source language. When the requested language has no value the
    Hindi one is served and `fallback_used` is true, so the client can tell the
    visitor instead of silently showing the wrong language. Neither stored
    language is ever merged or overwritten.

    ## Envelope

    Every response uses one of two shapes.

    Success:
    ```json
    { "success": true, "data": {}, "meta": null }
    ```
    Error:
    ```json
    { "success": false, "error": { "code": "…", "message": "…", "details": {} } }
    ```

    ## Authentication

    Browser clients use Sanctum stateful (cookie/session) authentication:

    1. `GET /sanctum/csrf-cookie` — sets the `XSRF-TOKEN` cookie.
    2. `POST /api/auth/login` — sets the HttpOnly session cookie.
    3. Every subsequent unsafe request echoes the cookie value in the
       `X-XSRF-TOKEN` header.

    The session cookie is HttpOnly, so no credential is readable from browser
    storage. The client must send credentials with every request
    (`withCredentials`), and the API's CORS allow-list must name the exact
    frontend origin.

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.thakurbari.example
    description: Production (placeholder)

tags:
  - name: System
  - name: Authentication
  - name: Public content
  - name: Admin
  - name: Content management
  - name: User management
  - name: Roles and permissions
  - name: Temple profile
  - name: Committee
  - name: Events

paths:
  /api/health:
    get:
      tags: [System]
      summary: Liveness and configuration probe
      security: []
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Health'

  /sanctum/csrf-cookie:
    get:
      tags: [Authentication]
      summary: Issue the CSRF cookie
      description: Must be called before the first unsafe request from a browser.
      security: []
      responses:
        '204':
          description: Cookie issued

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Rate limited to 5 attempts per minute per e-mail + IP.

        Credentials are verified before account status, so an unknown address and
        a wrong password are indistinguishable to the caller.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 191
                password:
                  type: string
                  minLength: 8
                  maxLength: 255
                remember:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_INACTIVE or ACCOUNT_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: TOO_MANY_REQUESTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out and invalidate the session
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: The signed-in user
      description: |
        Used by the Flutter client to restore a session on page load or refresh.
        Returns 403 when the account has been deactivated or blocked since the
        session began.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_INACTIVE or ACCOUNT_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset link
      description: |
        Always answers 200 with the same message, whether or not the address is
        registered, so the endpoint cannot be used to enumerate accounts. A link
        is only ever mailed to an active account. Rate limited to 3 requests per
        minute per e-mail + IP.

        The reset form itself is delivered in Phase 2.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 191 }
      responses:
        '200':
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: TOO_MANY_REQUESTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/admin/ping:
    get:
      tags: [Admin]
      summary: Protected-group probe
      description: |
        Proves that the admin route group is closed on the server. Replaced by
        the real dashboard endpoints in Phase 2.
      responses:
        '200':
          description: Reachable by an authenticated, active user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          user: { $ref: '#/components/schemas/User' }
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_INACTIVE or ACCOUNT_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/public/pages/{slug}:
    get:
      tags: [Public content]
      summary: A published CMS page
      description: |
        Only published pages are reachable. A draft and an unknown slug both
        return 404 with the same body, so a draft cannot be detected.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [hi, en], default: hi }
      responses:
        '200':
          description: The page, resolved for the requested language
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicPage' }
        '404':
          description: NOT_FOUND - unknown slug, or the page is a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/public/site-settings:
    get:
      tags: [Public content]
      summary: Site-wide content and the public navigation menu
      description: |
        Answers on a freshly installed site too, with empty values, so the client
        can render its empty states rather than an error.
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [hi, en], default: hi }
      responses:
        '200':
          description: Settings, contact block and visible navigation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicSiteSettings' }

  /api/admin/pages:
    get:
      tags: [Content management]
      summary: Every page including drafts
      description: Requires the `manage-content` ability (Super Admin, Admin, Content Manager).
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list, using the shared pagination meta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPage' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN, ACCOUNT_INACTIVE or ACCOUNT_BLOCKED }

  /api/admin/pages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Content management]
      summary: One page with both languages raw
      description: No fallback is applied, so the editor can see that English is empty.
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminPage' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Content management]
      summary: Update a page
      description: |
        Hindi fields are required; English fields are optional and a blank one is
        stored as absent, which is what the fallback rule keys on.

        `slug` is not accepted - it is the page's public URL. `published_at` is
        stamped by the server on the first draft-to-published transition and is
        never moved or cleared afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_hi, content_hi, status]
              properties:
                title_hi: { type: string, maxLength: 200 }
                title_en: { type: [string, 'null'], maxLength: 200 }
                content_hi: { type: string, maxLength: 100000 }
                content_en: { type: [string, 'null'], maxLength: 100000 }
                meta_title_hi: { type: [string, 'null'], maxLength: 200 }
                meta_title_en: { type: [string, 'null'], maxLength: 200 }
                meta_description_hi: { type: [string, 'null'], maxLength: 320 }
                meta_description_en: { type: [string, 'null'], maxLength: 320 }
                status: { type: string, enum: [draft, published] }
      responses:
        '200':
          description: The updated page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminPage' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }

  /api/admin/site-settings:
    get:
      tags: [Content management]
      summary: Settings and the full navigation menu, both languages raw
      responses:
        '200':
          description: Settings including hidden navigation items
        '403': { description: FORBIDDEN }
    put:
      tags: [Content management]
      summary: Update settings, and optionally replace the navigation menu
      description: |
        Every settings field is optional. When `navigation` is present it
        **replaces** the entire menu inside a transaction; omit it to leave the
        menu untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagline_hi: { type: [string, 'null'], maxLength: 200 }
                tagline_en: { type: [string, 'null'], maxLength: 200 }
                footer_text_hi: { type: [string, 'null'], maxLength: 400 }
                footer_text_en: { type: [string, 'null'], maxLength: 400 }
                village: { type: [string, 'null'] }
                panchayat: { type: [string, 'null'] }
                police_station: { type: [string, 'null'] }
                district: { type: [string, 'null'] }
                state: { type: [string, 'null'] }
                postal_code: { type: [string, 'null'] }
                country: { type: [string, 'null'] }
                contact_phone: { type: [string, 'null'] }
                contact_email: { type: [string, 'null'], format: email }
                map_url: { type: [string, 'null'], format: uri }
                social_links:
                  type: object
                  additionalProperties: { type: string, format: uri }
                navigation:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [label_hi, route]
                    properties:
                      label_hi: { type: string, maxLength: 120 }
                      label_en: { type: [string, 'null'], maxLength: 120 }
                      route: { type: string, maxLength: 300 }
                      sort_order: { type: integer, minimum: 0 }
                      is_visible: { type: boolean, default: true }
      responses:
        '200': { description: The updated settings and menu }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Complete a password reset
      description: |
        Finishes the flow the forgot-password endpoint starts. An invalid,
        expired or already-used token is refused with the same generic message,
        so the endpoint cannot be used to probe which tokens exist. A successful
        reset rotates the remember token, ending other sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Password changed }
        '422': { description: VALIDATION_FAILED - weak password, or invalid/expired token }
        '429': { description: TOO_MANY_REQUESTS }

  /api/admin/users:
    get:
      tags: [User management]
      summary: List committee accounts
      description: Requires `users.view`.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, blocked] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUser' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { description: FORBIDDEN }
    post:
      tags: [User management]
      summary: Create a committee account
      description: |
        Requires `users.manage`. **No password is accepted**: the account is
        stored with an unusable hash and a reset link is mailed, so a plaintext
        password never passes through the committee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, role_id]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: [string, 'null'], maxLength: 100 }
                email: { type: string, format: email, maxLength: 191 }
                mobile: { type: [string, 'null'], maxLength: 20 }
                role_id: { type: integer, description: Must be an active role }
                status: { type: string, enum: [active, inactive, blocked], default: active }
      responses:
        '201':
          description: Account created and a reset link sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - duplicate e-mail, unknown or inactive role }

  /api/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [User management]
      summary: One account
      description: Requires `users.view`.
      responses:
        '200': { description: The account }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [User management]
      summary: Update an account
      description: |
        Requires `users.manage`. Four refusals protect the administration itself
        and all surface as 422 against the named field:

        * the last active Super Admin cannot be demoted (`role_id`);
        * the last active Super Admin cannot be deactivated or blocked (`status`);
        * you cannot change your own role (`role_id`);
        * you cannot deactivate or block your own account (`status`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, role_id, status]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: [string, 'null'], maxLength: 100 }
                email: { type: string, format: email }
                mobile: { type: [string, 'null'], maxLength: 20 }
                role_id: { type: integer }
                status: { type: string, enum: [active, inactive, blocked] }
      responses:
        '200': { description: The updated account }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED, including the four safety refusals }

  /api/admin/users/{id}/login-history:
    get:
      tags: [User management]
      summary: Sign-in history for one account
      description: |
        Requires `security.view` — deliberately a different key from
        `users.manage`, so administering accounts and reading who tried to sign
        in to them can be granted separately. Records successes **and** failures.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated attempts, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LoginAttempt' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { description: FORBIDDEN }

  /api/admin/users/{id}/send-password-reset:
    post:
      tags: [User management]
      summary: Re-send a password reset link
      description: Requires `users.manage`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Link sent }
        '403': { description: FORBIDDEN }

  /api/admin/roles:
    get:
      tags: [Roles and permissions]
      summary: Roles with their effective permissions
      description: |
        Requires `roles.view`. Super Admin is reported with the whole catalogue
        and `is_editable: false`.
      responses:
        '200':
          description: The roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ManagedRole' }
        '403': { description: FORBIDDEN }

  /api/admin/permissions:
    get:
      tags: [Roles and permissions]
      summary: The permission catalogue, grouped by module
      description: |
        Requires `roles.view`. Includes keys for modules that later phases build;
        `phase` says which, so the UI can mark a toggle as not yet enforced.
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          modules:
                            type: array
                            items: { $ref: '#/components/schemas/PermissionModule' }
        '403': { description: FORBIDDEN }

  /api/admin/roles/{id}/permissions:
    put:
      tags: [Roles and permissions]
      summary: Replace a role's permission set
      description: |
        Requires `roles.manage`. Unknown keys are rejected **by name** rather
        than stored, and Super Admin cannot be restricted at all.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  maxItems: 100
                  items: { type: string, example: content.manage }
      responses:
        '200': { description: The updated role }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - unknown keys, or an attempt to restrict Super Admin }

  /api/public/temple-profile:
    get:
      tags: [Temple profile]
      summary: The temple's public identity
      description: |
        Authoritative for the temple's name and postal address. The Flutter
        client renders its header, hero, footer and page titles from `name`
        here, falling back to the application shell string only while this
        request is in flight.

        Always answers, even on a freshly installed site: an unconfigured
        temple returns empty values so the site shows its empty states rather
        than an error.
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicTempleProfile' }

  /api/public/committee:
    get:
      tags: [Committee]
      summary: The management committee
      description: |
        Published, currently-serving members only — the filter is in the query,
        not the serializer, so an unpublished member cannot leak through a
        presentation mistake. A member whose `tenure_end` has passed drops off
        this list while their record is kept for the committee.

        **Personal details are consent-gated.** `phone`, `email` and
        `photo_url` are **omitted entirely** unless the member's consent is on
        record *and* that specific detail is cleared for publication. An absent
        key is the contract: it is never sent as null.
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
      responses:
        '200':
          description: The committee, in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicCommitteeMember' }

  /api/admin/temple-profile:
    get:
      tags: [Temple profile]
      summary: The profile with both languages raw
      description: Requires `content.view`.
      responses:
        '200': { description: The profile }
        '403': { description: FORBIDDEN }
    put:
      tags: [Temple profile]
      summary: Update the temple profile
      description: |
        Requires `temple.manage`. Every field is optional: the committee fills
        the temple's details in over time and a half-configured profile must
        still save.

        `logo_url` and `map_url` are URLs rather than uploads; file handling
        with its own MIME and size validation is Phase 5.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TempleProfileInput' }
      responses:
        '200': { description: The updated profile }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/committee-members:
    get:
      tags: [Committee]
      summary: Every committee member
      description: |
        Requires `content.view`. Includes unpublished members and those whose
        term has ended — committee membership is village history and is not
        lost when a term ends. Personal details are present here: consent
        governs *publication*, not administration.
      responses:
        '200':
          description: The members, in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCommitteeMember' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Committee]
      summary: Add a committee member
      description: |
        Requires `temple.manage`. A new member is unpublished and unconsented
        unless the request says otherwise: publishing a person is a decision
        somebody has to make on purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitteeMemberInput' }
      responses:
        '201': { description: The member }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - including a visibility flag set without consent }

  /api/admin/committee-members/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Committee]
      summary: One member, raw
      description: Requires `content.view`.
      responses:
        '200': { description: The member }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Committee]
      summary: Update a member
      description: |
        Requires `temple.manage`. Two refusals surface as 422 against the named
        field:

        * a `show_*_publicly` flag set while `has_consent` is false;
        * `tenure_end` earlier than `tenure_start`.

        Setting `has_consent` to false clears all three visibility flags in the
        same transaction, so a stale `true` cannot survive a withdrawal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitteeMemberInput' }
      responses:
        '200': { description: The updated member }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Committee]
      summary: Remove a member permanently
      description: |
        Requires `temple.manage`. This is **erasure**, distinct from ending a
        tenure: setting `tenure_end` retires somebody while keeping the record.
        Deletion exists because a person may ask for their personal data to be
        removed.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /api/public/events:
    get:
      tags: [Events]
      summary: The calendar, as dated occurrences
      description: |
        Returns **occurrences**, not stored rows. A recurring event is stored
        once as a rule — "the aarti, daily, at 18:30" — and expanded here across
        the requested window, so the daily aarti is one record and appears every
        day.

        Drafts are excluded in the query, never in the serializer. Cancelled
        events **are** returned, flagged with `is_cancelled`: silently dropping
        a cancelled festival would leave devotees who planned around it finding
        nothing and assuming the site was broken.

        The window is bounded (`days`, default 90, maximum 366) and each event
        contributes at most 366 occurrences, so an indefinite daily rule cannot
        produce an unbounded response.
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
        - name: view
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
          description: |
            `upcoming` returns occurrences that have not finished, soonest
            first — a festival that began yesterday and ends tomorrow has not
            been missed. `past` returns finished occurrences, most recent first.
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 90 } }
        - { name: featured, in: query, schema: { type: boolean }, description: A cancelled event is never featured. }
        - { name: type, in: query, schema: { type: string, enum: [aarti, bhajan_kirtan, festival, puja, other] }, description: An unrecognised value is ignored rather than refused. }
      responses:
        '200':
          description: The occurrences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventOccurrence' }
                      meta:
                        type: object
                        properties:
                          view: { type: string, enum: [upcoming, past] }
                          timezone: { type: string, example: Asia/Kolkata }
                          count: { type: integer }

  /api/public/events/{id}:
    get:
      tags: [Events]
      summary: One event and its next occurrences
      description: |
        A draft is indistinguishable from an event that does not exist: both are
        404. `on` names the occurrence the visitor arrived at, so a shared link
        to "the aarti on the 12th" still opens on the 12th.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
        - { name: on, in: query, schema: { type: string, format: date }, description: Which occurrence to open on. }
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          event: { $ref: '#/components/schemas/EventOccurrence' }
                          occurrences:
                            type: array
                            items: { $ref: '#/components/schemas/EventOccurrence' }
        '404': { description: NOT_FOUND - unknown, or still a draft }

  /api/admin/events:
    get:
      tags: [Events]
      summary: Every event, including drafts and past ones
      description: |
        Requires `content.view`. The calendar is a record as well as a schedule,
        so nothing is filtered out by default. A repeating event appears once —
        it is the rule, not the dates it produces.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published, cancelled] } }
      responses:
        '200':
          description: The events, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminEvent' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Events]
      summary: Add an event
      description: Requires `events.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201': { description: The event }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Events]
      summary: One event, raw
      description: Requires `content.view`.
      responses:
        '200': { description: The event }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Events]
      summary: Update an event
      description: |
        Requires `events.manage`. Two refusals surface as 422 against the named
        field: `end_at` earlier than `start_at`, and `recurrence_until` earlier
        than the first occurrence.

        Setting `status` to `cancelled` clears `is_featured` — a cancelled event
        is never promoted on the home page. `recurrence_days` is cleared for any
        rule other than `weekly`, and a weekly rule with no days adopts the
        weekday the event starts on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { description: The updated event }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Events]
      summary: Remove an event permanently
      description: |
        Requires `events.manage`. Distinct from cancelling: setting the status
        to `cancelled` keeps the record and tells devotees the event is off.
        Deletion is for entries created by mistake.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  # --- Gallery and video darshan (Phase 5) ----------------------------------

  /api/public/media:
    get:
      tags: [Media]
      summary: The published gallery, paginated
      security: []
      description: |
        Published items only, filtered in the query rather than the serializer.
        The response is **paginated**: an unbounded gallery is a
        denial-of-service against this API, and worse here than elsewhere
        because every row carries three image URLs.

        `per_page` defaults to 24 and is capped at 60. Ordering is the
        committee's arrangement (`sort_order`) and then newest first, so
        anything unarranged still appears somewhere sensible.

        An `album` slug that names an **unpublished** album returns nothing: the
        album is the arrangement the committee has not finished.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
        - { name: type, in: query, schema: { type: string, enum: [photo, video] } }
        - { name: album, in: query, schema: { type: string }, description: Album slug }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
      responses:
        '200':
          description: One page of the gallery
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicMedia' }
                      meta: { $ref: '#/components/schemas/PageMeta' }

  /api/public/media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: One published gallery item
      security: []
      description: A draft is indistinguishable from an item that does not exist.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicMedia' }
        '404': { description: NOT_FOUND }

  /api/public/albums:
    get:
      tags: [Media]
      summary: Published albums with their covers
      security: []
      description: |
        `media_count` is the number of **published** photographs in the album —
        deliberately a different number from the one the library shows an
        editor, which includes drafts.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicAlbum' }

  /api/admin/media:
    get:
      tags: [Media]
      summary: The whole library, including drafts
      description: Requires `content.view`, so a Viewer can see it without changing it.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
        - { name: type, in: query, schema: { type: string, enum: [photo, video] } }
        - { name: album, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Every item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMedia' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Media]
      summary: Upload a photograph (multipart)
      description: |
        Requires `media.manage`, and rate-limited separately
        (`throttle:media-upload`, 30/minute): this is the only endpoint that
        consumes disk.

        The file is validated **by its bytes**, never by its name or the
        declared `Content-Type`:

        1. size, against `media.max_upload_kb` (default 8 MB);
        2. the MIME the server detects, against an allow-list of
           `image/jpeg`, `image/png`, `image/webp` — no GIF, no SVG;
        3. that the bytes decode as an image of that type, within bounds.

        It is then **re-encoded**, which is the metadata strip: EXIF (including
        GPS), XMP, IPTC, colour profiles and anything appended to the file are
        not carried across, because nothing is copied. The same pass writes up
        to three responsive variants (480 / 1080 / 1920 px on the longest edge);
        an image smaller than a bound is never upscaled and simply has fewer
        variants. The original is not kept.

        A refused upload leaves neither a row nor a file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title_hi, status]
              properties:
                file: { type: string, format: binary }
                title_hi: { type: string, maxLength: 200 }
                title_en: { type: [string, 'null'], maxLength: 200 }
                caption_hi: { type: [string, 'null'] }
                caption_en: { type: [string, 'null'] }
                album_id: { type: [integer, 'null'] }
                sort_order: { type: [integer, 'null'] }
                status: { type: string, enum: [draft, published] }
      responses:
        '201':
          description: The stored item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminMedia' }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED — the refusal is against `file` }
        '429': { description: TOO_MANY_REQUESTS }
        '500': { description: SERVER_ERROR — image processing unavailable on this host }

  /api/admin/media/video:
    post:
      tags: [Media]
      summary: Link a video (nothing is uploaded)
      description: |
        Requires `media.manage`. Only YouTube links are accepted, and what is
        stored is the extracted **video id**, not the URL that was typed: an
        arbitrary embed source out of an admin form is a stored-XSS vector.
        Tracking parameters are therefore dropped, and the canonical URL and
        the `youtube-nocookie` embed URL are both rebuilt from the id.

        Video files are not hosted: a ten-minute aarti recording is hundreds of
        megabytes, and village shared hosting has neither the disk nor the
        outbound bandwidth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_url, title_hi, status]
              properties:
                external_url: { type: string, format: uri }
                thumbnail_url: { type: [string, 'null'], format: uri }
                title_hi: { type: string, maxLength: 200 }
                title_en: { type: [string, 'null'] }
                caption_hi: { type: [string, 'null'] }
                caption_en: { type: [string, 'null'] }
                album_id: { type: [integer, 'null'] }
                status: { type: string, enum: [draft, published] }
      responses:
        '201': { description: The stored item }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED — not a YouTube video link }

  /api/admin/media/reorder:
    post:
      tags: [Media]
      summary: Apply a new gallery arrangement
      description: |
        Requires `media.manage`. The **whole** ordering is sent rather than one
        move, and applied in one transaction, so a dropped request leaves the
        previous arrangement intact rather than half of a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 500
                  items: { type: integer }
      responses:
        '200': { description: Order updated }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: One item, raw
      description: Requires `content.view`.
      responses:
        '200': { description: The item }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Media]
      summary: Edit titles, captions, album, order and status
      description: |
        Requires `media.manage`.

        The stored **file cannot be replaced**. Every reference to a photograph
        on this site is by URL, so swapping the bytes under a URL would silently
        change a page, an event poster and a committee portrait at once.
        Uploading a new item and repointing the reference is visible; replacing
        bytes in place is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaInput' }
      responses:
        '200': { description: The updated item }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Media]
      summary: Delete an item and its stored files
      description: |
        Requires `media.manage`.

        **Refused with 409 `MEDIA_IN_USE`** while anything on the site still
        points at the file: the temple logo, a committee member's photograph, an
        event poster, an album cover, or a page whose body embeds the URL. The
        error names the referring records, because "cannot delete" with no
        reason is a dead end for a committee member who cannot read the
        database. Unpublishing is always available instead.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409':
          description: MEDIA_IN_USE
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          details:
                            type: object
                            properties:
                              references:
                                type: array
                                items: { $ref: '#/components/schemas/MediaReference' }

  /api/admin/media/{id}/references:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: What would block deleting this item
      description: |
        Requires `content.view`. Asked *before* offering a delete button, so a
        blocked deletion is explained rather than attempted and refused.
      responses:
        '200':
          description: The references, and whether deletion is possible
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          can_delete: { type: boolean }
                          references:
                            type: array
                            items: { $ref: '#/components/schemas/MediaReference' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /api/admin/albums:
    get:
      tags: [Media]
      summary: Albums, with counts that include drafts
      description: Requires `content.view`.
      responses:
        '200':
          description: The albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminAlbum' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Media]
      summary: Create an album
      description: |
        Requires `media.manage`. `slug` is optional: a Hindi-only title
        transliterates to nothing usable, so the server generates a unique slug
        rather than letting two albums collide on an empty string.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumInput' }
      responses:
        '201': { description: The album }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: One album
      description: Requires `content.view`.
      responses:
        '200': { description: The album }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Media]
      summary: Update an album
      description: Requires `media.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumInput' }
      responses:
        '200': { description: The updated album }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Media]
      summary: Remove an album, keeping its photographs
      description: |
        Requires `media.manage`. Deliberately **not** a cascade: an album is an
        arrangement, and losing an arrangement must never lose the content. Its
        photographs survive, unfiled.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: radha_krishna_thakurbari_session
      description: HttpOnly session cookie issued by the login endpoint.

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          oneOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: 'null'

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code; mirrored by the Flutter client.
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - ACCOUNT_INACTIVE
                - ACCOUNT_BLOCKED
                - FORBIDDEN
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - TOO_MANY_REQUESTS
                - CSRF_TOKEN_MISMATCH
                - MEDIA_IN_USE
                - SERVER_ERROR
            message:
              type: string
              description: Human-readable detail. Clients render their own localized text.
            details:
              type: object
              description: Field-keyed validation messages, or extra context.
              additionalProperties:
                type: array
                items: { type: string }

    PageMeta:
      type: object
      description: Pagination convention, reused by every paginated endpoint.
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        has_more: { type: boolean }

    Role:
      type: object
      properties:
        id: { type: integer }
        slug:
          type: string
          enum: [super-admin, admin, treasurer, content-manager, viewer]
        name: { type: string }

    User:
      type: object
      description: The password hash and remember token are never exposed.
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: [string, 'null'] }
        full_name: { type: string }
        email: { type: string, format: email }
        mobile: { type: [string, 'null'] }
        status:
          type: string
          enum: [active, inactive, blocked]
        last_login_at: { type: [string, 'null'], format: date-time }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: >
            The caller's effective permission keys. The client uses these to hide
            actions the server would refuse; it is never the access control.
          items: { type: string }

    LocalizedText:
      type: object
      description: |
        One piece of bilingual content resolved for the requested language.
        `language` is what was actually served, which may differ from what was
        asked for; `fallback_used` says so explicitly.
      properties:
        value: { type: [string, 'null'] }
        language: { type: string, enum: [hi, en] }
        fallback_used: { type: boolean }

    PublicPage:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        content: { $ref: '#/components/schemas/LocalizedText' }
        meta_title: { $ref: '#/components/schemas/LocalizedText' }
        meta_description: { $ref: '#/components/schemas/LocalizedText' }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    AdminPage:
      type: object
      description: Both languages raw, no fallback applied. Admin surface only.
      properties:
        id: { type: integer }
        slug: { type: string }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        content_hi: { type: string }
        content_en: { type: [string, 'null'] }
        meta_title_hi: { type: [string, 'null'] }
        meta_title_en: { type: [string, 'null'] }
        meta_description_hi: { type: [string, 'null'] }
        meta_description_en: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published] }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    NavigationItem:
      type: object
      properties:
        id: { type: integer }
        label: { $ref: '#/components/schemas/LocalizedText' }
        route: { type: string, description: Internal path such as /about, or an absolute URL }
        sort_order: { type: integer }

    PublicSiteSettings:
      type: object
      properties:
        requested_language: { type: string, enum: [hi, en] }
        tagline: { $ref: '#/components/schemas/LocalizedText' }
        footer_text: { $ref: '#/components/schemas/LocalizedText' }
        contact:
          type: object
          description: |
            How to reach the committee. The postal address is **not** here:
            Phase 3 moved it to `GET /api/public/temple-profile`, which is now
            the only source of truth for where the temple is.
          properties:
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            map_url: { type: [string, 'null'] }
        social_links:
          type: object
          additionalProperties: { type: string }
        default_meta_title: { $ref: '#/components/schemas/LocalizedText' }
        default_meta_description: { $ref: '#/components/schemas/LocalizedText' }
        navigation:
          type: array
          items: { $ref: '#/components/schemas/NavigationItem' }

    AdminUser:
      type: object
      description: The password hash is never exposed.
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: [string, 'null'] }
        full_name: { type: string }
        email: { type: string, format: email }
        mobile: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive, blocked] }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        role: { $ref: '#/components/schemas/Role' }

    ManagedRole:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        permissions:
          type: array
          items: { type: string }
        is_editable:
          type: boolean
          description: False for Super Admin, whose set is computed and fixed.
        user_count: { type: [integer, 'null'] }

    PermissionModule:
      type: object
      properties:
        module: { type: string }
        label: { type: string }
        phase:
          type: integer
          description: The phase that builds this module; keys beyond the delivered phases are grantable but not yet enforced.
        permissions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }

    LoginAttempt:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        outcome:
          type: string
          enum: [success, invalid_credentials, inactive, blocked]
        successful: { type: boolean }
        ip_address: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    TempleAddress:
      type: object
      description: The temple's postal address. Authoritative since Phase 3.
      properties:
        address_line1: { type: [string, 'null'] }
        address_line2: { type: [string, 'null'] }
        village: { type: [string, 'null'] }
        panchayat: { type: [string, 'null'] }
        police_station: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        map_url: { type: [string, 'null'] }

    PublicTempleProfile:
      type: object
      properties:
        requested_language: { type: string, enum: [hi, en] }
        name: { $ref: '#/components/schemas/LocalizedText' }
        history: { $ref: '#/components/schemas/LocalizedText' }
        mission: { $ref: '#/components/schemas/LocalizedText' }
        address: { $ref: '#/components/schemas/TempleAddress' }
        logo_url: { type: [string, 'null'] }
        established_year: { type: [integer, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }

    TempleProfileInput:
      type: object
      description: Every field optional; blanks are sent as null, not empty strings.
      properties:
        name_hi: { type: [string, 'null'], maxLength: 200 }
        name_en: { type: [string, 'null'], maxLength: 200 }
        history_hi: { type: [string, 'null'] }
        history_en: { type: [string, 'null'] }
        mission_hi: { type: [string, 'null'] }
        mission_en: { type: [string, 'null'] }
        address_line1: { type: [string, 'null'], maxLength: 200 }
        address_line2: { type: [string, 'null'], maxLength: 200 }
        village: { type: [string, 'null'], maxLength: 120 }
        panchayat: { type: [string, 'null'], maxLength: 120 }
        police_station: { type: [string, 'null'], maxLength: 120 }
        district: { type: [string, 'null'], maxLength: 120 }
        state: { type: [string, 'null'], maxLength: 120 }
        postal_code: { type: [string, 'null'], maxLength: 20 }
        country: { type: [string, 'null'], maxLength: 120 }
        logo_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        map_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        established_year: { type: [integer, 'null'], minimum: 1000 }

    PublicCommitteeMember:
      type: object
      description: |
        `phone`, `email` and `photo_url` are **absent** unless consent is on
        record and that detail is cleared for publication. They are never
        returned as null.
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/LocalizedText' }
        designation: { $ref: '#/components/schemas/LocalizedText' }
        bio: { $ref: '#/components/schemas/LocalizedText' }
        tenure_start: { type: [string, 'null'], format: date }
        tenure_end: { type: [string, 'null'], format: date }
        sort_order: { type: integer }
        phone: { type: string, description: Present only with recorded consent. }
        email: { type: string, description: Present only with recorded consent. }
        photo_url: { type: string, description: Present only with recorded consent. }

    AdminCommitteeMember:
      type: object
      properties:
        id: { type: integer }
        name_hi: { type: string }
        name_en: { type: [string, 'null'] }
        designation_hi: { type: string }
        designation_en: { type: [string, 'null'] }
        bio_hi: { type: [string, 'null'] }
        bio_en: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        photo_url: { type: [string, 'null'] }
        tenure_start: { type: [string, 'null'], format: date }
        tenure_end: { type: [string, 'null'], format: date }
        tenure_has_ended: { type: boolean }
        is_published: { type: boolean }
        sort_order: { type: integer }
        has_consent:
          type: boolean
          description: Whether the member's consent to publish personal details is on record.
        contact_consent_at: { type: [string, 'null'], format: date-time }
        consent_recorded_by: { type: [string, 'null'] }
        show_phone_publicly: { type: boolean }
        show_email_publicly: { type: boolean }
        show_photo_publicly: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }

    CommitteeMemberInput:
      type: object
      required: [name_hi, designation_hi]
      description: |
        `has_consent` and the three `show_*_publicly` flags are evaluated
        together: a flag set while consent is absent is refused by name, and
        withdrawing consent clears all three.
      properties:
        name_hi: { type: string, maxLength: 160 }
        name_en: { type: [string, 'null'], maxLength: 160 }
        designation_hi: { type: string, maxLength: 160 }
        designation_en: { type: [string, 'null'], maxLength: 160 }
        bio_hi: { type: [string, 'null'], maxLength: 5000 }
        bio_en: { type: [string, 'null'], maxLength: 5000 }
        phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], format: email }
        photo_url: { type: [string, 'null'], format: uri }
        tenure_start: { type: [string, 'null'], format: date }
        tenure_end: { type: [string, 'null'], format: date }
        is_published: { type: boolean, default: false }
        has_consent: { type: boolean, default: false }
        show_phone_publicly: { type: boolean, default: false }
        show_email_publicly: { type: boolean, default: false }
        show_photo_publicly: { type: boolean, default: false }
        sort_order: { type: integer, minimum: 0, maximum: 9999 }

    EventOccurrence:
      type: object
      description: |
        One dated instance of an event. `id` is the event; `occurrence_key`
        (`<id>@<date>`) identifies this particular date, so a link to one day of
        a repeating event survives being shared.
      properties:
        id: { type: integer }
        occurrence_key: { type: string, example: "7@2026-10-12" }
        event_type: { type: string, enum: [aarti, bhajan_kirtan, festival, puja, other] }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        venue: { $ref: '#/components/schemas/LocalizedText' }
        start_at:
          type: string
          format: date-time
          description: ISO-8601 **with the temple's offset**, not bare UTC, so a client that ignores timezones still shows the right local time.
          example: "2026-10-12T18:30:00+05:30"
        end_at: { type: [string, 'null'], format: date-time }
        timezone: { type: string, example: Asia/Kolkata }
        is_recurring: { type: boolean }
        recurrence: { type: string, enum: [none, daily, weekly, monthly, yearly] }
        is_featured: { type: boolean }
        is_cancelled: { type: boolean }
        poster_url: { type: [string, 'null'] }

    AdminEvent:
      type: object
      description: The stored rule, not the dates it produces.
      properties:
        id: { type: integer }
        event_type: { type: string }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        venue_hi: { type: [string, 'null'] }
        venue_en: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        recurrence: { type: string, enum: [none, daily, weekly, monthly, yearly] }
        recurrence_days:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: ISO weekdays, 1 = Monday. Meaningful only for a weekly rule.
        recurrence_until: { type: [string, 'null'], format: date }
        poster_url: { type: [string, 'null'] }
        is_featured: { type: boolean }
        status: { type: string, enum: [draft, published, cancelled] }
        timezone: { type: string }
        updated_at: { type: [string, 'null'], format: date-time }

    EventInput:
      type: object
      required: [event_type, title_hi, start_at, status]
      properties:
        event_type: { type: string, enum: [aarti, bhajan_kirtan, festival, puja, other] }
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'], maxLength: 200 }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        venue_hi: { type: [string, 'null'], maxLength: 200 }
        venue_en: { type: [string, 'null'], maxLength: 200 }
        start_at:
          type: string
          description: Read in the temple's timezone, which is the clock the committee typed.
          example: "2026-10-15 18:00:00"
        end_at: { type: [string, 'null'], description: Must be at or after start_at. }
        recurrence: { type: string, enum: [none, daily, weekly, monthly, yearly], default: none }
        recurrence_days:
          type: array
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        recurrence_until: { type: [string, 'null'], format: date }
        poster_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        is_featured: { type: boolean, default: false }
        status: { type: string, enum: [draft, published, cancelled] }

    Health:
      type: object
      properties:
        status: { type: string }
        application: { type: string }
        environment: { type: string }
        timezone: { type: string }
        locale: { type: string }
        database:
          type: string
          enum: [connected, unavailable]
        time: { type: string, format: date-time }

    PublicMedia:
      type: object
      description: |
        All three image sizes are sent on every item so the client can pick per
        use: a grid tile takes `thumb_url` and never the full photograph, and a
        lightbox takes `medium_url` or `large_url` by form factor. Sending one
        size only would mean either a grid that downloads full-size photographs
        or a lightbox that shows blurred ones.

        A photograph smaller than a variant's bound was never upscaled, so the
        smaller URLs legitimately resolve to the same stored file.
      properties:
        id: { type: integer }
        media_type: { type: string, enum: [photo, video] }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        caption: { $ref: '#/components/schemas/LocalizedText' }
        thumb_url: { type: [string, 'null'], description: 480 px longest edge }
        medium_url: { type: [string, 'null'], description: 1080 px longest edge }
        large_url: { type: [string, 'null'], description: 1920 px longest edge }
        file_url: { type: [string, 'null'] }
        external_url: { type: [string, 'null'], description: Videos only }
        provider: { type: [string, 'null'], enum: [youtube, null] }
        embed_url:
          type: [string, 'null']
          description: Built from the stored video id, never from admin input.
        thumbnail_url: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        album_id: { type: [integer, 'null'] }
        sort_order: { type: integer }

    AdminMedia:
      type: object
      description: |
        Both languages raw, plus the technical detail an editor needs to judge a
        file. `mime_type` is the type the **server detected from the bytes**,
        not the one the browser claimed, and `original_name` is a display label
        only — it is never used to build a filesystem path.
      properties:
        id: { type: integer }
        media_type: { type: string, enum: [photo, video] }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        caption_hi: { type: [string, 'null'] }
        caption_en: { type: [string, 'null'] }
        thumb_url: { type: [string, 'null'] }
        medium_url: { type: [string, 'null'] }
        large_url: { type: [string, 'null'] }
        file_url: { type: [string, 'null'] }
        external_url: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        provider_ref: { type: [string, 'null'] }
        embed_url: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        mime_type: { type: [string, 'null'] }
        byte_size: { type: [integer, 'null'], description: After re-encoding }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        original_name: { type: [string, 'null'] }
        album_id: { type: [integer, 'null'] }
        sort_order: { type: integer }
        status: { type: string, enum: [draft, published] }
        updated_at: { type: [string, 'null'], format: date-time }

    MediaInput:
      type: object
      required: [title_hi, status]
      description: Carries no file — see PUT /api/admin/media/{id}.
      properties:
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'], maxLength: 200 }
        caption_hi: { type: [string, 'null'], maxLength: 2000 }
        caption_en: { type: [string, 'null'], maxLength: 2000 }
        external_url: { type: [string, 'null'], description: Videos only }
        thumbnail_url: { type: [string, 'null'] }
        album_id: { type: [integer, 'null'] }
        sort_order: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, published] }

    MediaReference:
      type: object
      description: One record that still points at a media item.
      properties:
        type:
          type: string
          enum: [temple_logo, committee_member, event_poster, album_cover, page]
        label: { type: string, description: The Hindi name of the referring record }
        id: { type: [integer, 'null'] }

    PublicAlbum:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        cover_url: { type: [string, 'null'] }
        media_count: { type: integer, description: Published photographs only }
        sort_order: { type: integer }

    AdminAlbum:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        cover_media_id: { type: [integer, 'null'] }
        cover_url: { type: [string, 'null'] }
        media_count: { type: integer, description: Includes drafts }
        sort_order: { type: integer }
        status: { type: string, enum: [draft, published] }
        updated_at: { type: [string, 'null'], format: date-time }

    AlbumInput:
      type: object
      required: [title_hi, status]
      properties:
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'] }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Generated from the English title when omitted.
        cover_media_id: { type: [integer, 'null'] }
        sort_order: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, published] }

security:
  - sessionCookie: []
