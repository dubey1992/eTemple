        established_year: { type: [integer, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }

    TempleProfileInput:
      type: object
      description: Every field optional; blanks are sent as null, not empty strings.
      properties:
        name_hi: { type: [string, 'null'], maxLength: 200 }
        name_en: { type: [string, 'null'], maxLength: 200 }
        history_hi: { type: [string, 'null'] }
        history_en: { type: [string, 'null'] }
        mission_hi: { type: [string, 'null'] }
        mission_en: { type: [string, 'null'] }
        address_line1_hi: { type: [string, 'null'], maxLength: 200 }
        address_line1_en: { type: [string, 'null'], maxLength: 200 }
        address_line2_hi: { type: [string, 'null'], maxLength: 200 }
        address_line2_en: { type: [string, 'null'], maxLength: 200 }
        village_hi: { type: [string, 'null'], maxLength: 120 }
        village_en: { type: [string, 'null'], maxLength: 120 }
        panchayat_hi: { type: [string, 'null'], maxLength: 120 }
        panchayat_en: { type: [string, 'null'], maxLength: 120 }
        police_station_hi: { type: [string, 'null'], maxLength: 120 }
        police_station_en: { type: [string, 'null'], maxLength: 120 }
        district_hi: { type: [string, 'null'], maxLength: 120 }
        district_en: { type: [string, 'null'], maxLength: 120 }
        state_hi: { type: [string, 'null'], maxLength: 120 }
        state_en: { type: [string, 'null'], maxLength: 120 }
        postal_code: { type: [string, 'null'], maxLength: 20 }
        country_hi: { type: [string, 'null'], maxLength: 120 }
        country_en: { type: [string, 'null'], maxLength: 120 }
        logo_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        map_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        established_year: { type: [integer, 'null'], minimum: 1000 }

    PublicCommitteeMember:
      type: object
      description: |
        `phone`, `email` and `photo_url` are **absent** unless consent is on
        record and that detail is cleared for publication. They are never
        returned as null.
      properties:
        id: { type: integer }
        name: { $ref: '#/components/schemas/LocalizedText' }
        designation: { $ref: '#/components/schemas/LocalizedText' }
        bio: { $ref: '#/components/schemas/LocalizedText' }
        tenure_start: { type: [string, 'null'], format: date }
        tenure_end: { type: [string, 'null'], format: date }
        sort_order: { type: integer }
        phone: { type: string, description: Present only with recorded consent. }
        email: { type: string, description: Present only with recorded consent. }
        photo_url: { type: string, description: Present only with recorded consent. }

    AdminCommitteeMember:
      type: object
      properties:
        id: { type: integer }
        name_hi: { type: string }
        name_en: { type: [string, 'null'] }
        designation_hi: { type: string }
        designation_en: { type: [string, 'null'] }
        bio_hi: { type: [string, 'null'] }
        bio_en: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        photo_url: { type: [string, 'null'] }
        tenure_start: { type: [string, 'null'], format: date }
        tenure_end: { type: [string, 'null'], format: date }
        tenure_has_ended: { type: boolean }
        is_published: { type: boolean }
        sort_order: { type: integer }
        has_consent:
          type: boolean
          description: Whether the member's consent to publish personal details is on record.
        contact_consent_at: { type: [string, 'null'], format: date-time }
        consent_recorded_by: { type: [string, 'null'] }
        show_phone_publicly: { type: boolean }
        show_email_publicly: { type: boolean }
        show_photo_publicly: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }

    CommitteeMemberInput:
      type: object
      required: [name_hi, designation_hi]
      description: |
        `has_consent` and the three `show_*_publicly` flags are evaluated
        together: a flag set while consent is absent is refused by name, and
        withdrawing consent clears all three.
      properties:
        name_hi: { type: string, maxLength: 160 }
        name_en: { type: [string, 'null'], maxLength: 160 }
        designation_hi: { type: string, maxLength: 160 }
        designation_en: { type: [string, 'null'], maxLength: 160 }
        bio_hi: { type: [string, 'null'], maxLength: 5000 }
        bio_en: { type: [string, 'null'], maxLength: 5000 }
        phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], format: email }
        photo_url: { type: [string, 'null'], format: uri }
        tenure_start: { type: [string, 'null'], format: date }
        tenure_end: { type: [string, 'null'], format: date }
        is_published: { type: boolean, default: false }
        has_consent: { type: boolean, default: false }
        show_phone_publicly: { type: boolean, default: false }
        show_email_publicly: { type: boolean, default: false }
        show_photo_publicly: { type: boolean, default: false }
        sort_order: { type: integer, minimum: 0, maximum: 9999 }

    EventOccurrence:
      type: object
      description: |
        One dated instance of an event. `id` is the event; `occurrence_key`
        (`<id>@<date>`) identifies this particular date, so a link to one day of
        a repeating event survives being shared.
      properties:
        id: { type: integer }
        occurrence_key: { type: string, example: "7@2026-10-12" }
        event_type: { type: string, enum: [aarti, bhajan_kirtan, festival, puja, community_service, other] }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        venue: { $ref: '#/components/schemas/LocalizedText' }
        start_at:
          type: string
          format: date-time
          description: ISO-8601 **with the temple's offset**, not bare UTC, so a client that ignores timezones still shows the right local time.
          example: "2026-10-12T18:30:00+05:30"
        end_at: { type: [string, 'null'], format: date-time }
        timezone: { type: string, example: Asia/Kolkata }
        is_recurring: { type: boolean }
        recurrence: { type: string, enum: [none, daily, weekly, monthly, yearly] }
        is_featured: { type: boolean }
        is_cancelled: { type: boolean }
        poster_url: { type: [string, 'null'] }

    AdminEvent:
      type: object
      description: The stored rule, not the dates it produces.
      properties:
        id: { type: integer }
        event_type: { type: string }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        venue_hi: { type: [string, 'null'] }
        venue_en: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        recurrence: { type: string, enum: [none, daily, weekly, monthly, yearly] }
        recurrence_days:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: ISO weekdays, 1 = Monday. Meaningful only for a weekly rule.
        recurrence_until: { type: [string, 'null'], format: date }
        poster_url: { type: [string, 'null'] }
        is_featured: { type: boolean }
        status: { type: string, enum: [draft, published, cancelled] }
        timezone: { type: string }
        updated_at: { type: [string, 'null'], format: date-time }

    EventInput:
      type: object
      required: [event_type, title_hi, start_at, status]
      properties:
        event_type: { type: string, enum: [aarti, bhajan_kirtan, festival, puja, community_service, other] }
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'], maxLength: 200 }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        venue_hi: { type: [string, 'null'], maxLength: 200 }
        venue_en: { type: [string, 'null'], maxLength: 200 }
        start_at:
          type: string
          description: Read in the temple's timezone, which is the clock the committee typed.
          example: "2026-10-15 18:00:00"
        end_at: { type: [string, 'null'], description: Must be at or after start_at. }
        recurrence: { type: string, enum: [none, daily, weekly, monthly, yearly], default: none }
        recurrence_days:
          type: array
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
        recurrence_until: { type: [string, 'null'], format: date }
        poster_url: { type: [string, 'null'], format: uri, maxLength: 500 }
        is_featured: { type: boolean, default: false }
        status: { type: string, enum: [draft, published, cancelled] }

    Health:
      type: object
      properties:
        status: { type: string }
        application: { type: string }
        environment: { type: string }
        timezone: { type: string }
        locale: { type: string }
        database:
          type: string
          enum: [connected, unavailable]
        time: { type: string, format: date-time }

    PublicMedia:
      type: object
      description: |
        All three image sizes are sent on every item so the client can pick per
        use: a grid tile takes `thumb_url` and never the full photograph, and a
        lightbox takes `medium_url` or `large_url` by form factor. Sending one
        size only would mean either a grid that downloads full-size photographs
        or a lightbox that shows blurred ones.

        A photograph smaller than a variant's bound was never upscaled, so the
        smaller URLs legitimately resolve to the same stored file.
      properties:
        id: { type: integer }
        media_type: { type: string, enum: [photo, video] }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        caption: { $ref: '#/components/schemas/LocalizedText' }
        thumb_url: { type: [string, 'null'], description: 480 px longest edge }
        medium_url: { type: [string, 'null'], description: 1080 px longest edge }
        large_url: { type: [string, 'null'], description: 1920 px longest edge }
        file_url: { type: [string, 'null'] }
        external_url: { type: [string, 'null'], description: Videos only }
        provider: { type: [string, 'null'], enum: [youtube, null] }
        embed_url:
          type: [string, 'null']
          description: Built from the stored video id, never from admin input.
        thumbnail_url: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        album_id: { type: [integer, 'null'] }
        sort_order: { type: integer }

    AdminMedia:
      type: object
      description: |
        Both languages raw, plus the technical detail an editor needs to judge a
        file. `mime_type` is the type the **server detected from the bytes**,
        not the one the browser claimed, and `original_name` is a display label
        only — it is never used to build a filesystem path.
      properties:
        id: { type: integer }
        media_type: { type: string, enum: [photo, video] }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        caption_hi: { type: [string, 'null'] }
        caption_en: { type: [string, 'null'] }
        thumb_url: { type: [string, 'null'] }
        medium_url: { type: [string, 'null'] }
        large_url: { type: [string, 'null'] }
        file_url: { type: [string, 'null'] }
        external_url: { type: [string, 'null'] }
        provider: { type: [string, 'null'] }
        provider_ref: { type: [string, 'null'] }
        embed_url: { type: [string, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        mime_type: { type: [string, 'null'] }
        byte_size: { type: [integer, 'null'], description: After re-encoding }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        original_name: { type: [string, 'null'] }
        album_id: { type: [integer, 'null'] }
        sort_order: { type: integer }
        status: { type: string, enum: [draft, published] }
        updated_at: { type: [string, 'null'], format: date-time }

    MediaInput:
      type: object
      required: [title_hi, status]
      description: Carries no file — see PUT /api/admin/media/{id}.
      properties:
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'], maxLength: 200 }
        caption_hi: { type: [string, 'null'], maxLength: 2000 }
        caption_en: { type: [string, 'null'], maxLength: 2000 }
        external_url: { type: [string, 'null'], description: Videos only }
        thumbnail_url: { type: [string, 'null'] }
        album_id: { type: [integer, 'null'] }
        sort_order: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, published] }

    MediaReference:
      type: object
      description: One record that still points at a media item.
      properties:
        type:
          type: string
          enum: [temple_logo, committee_member, event_poster, album_cover, page]
        label: { type: string, description: The Hindi name of the referring record }
        id: { type: [integer, 'null'] }

    PublicAlbum:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        cover_url: { type: [string, 'null'] }
        media_count: { type: integer, description: Published photographs only }
        sort_order: { type: integer }

    AdminAlbum:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        cover_media_id: { type: [integer, 'null'] }
        cover_url: { type: [string, 'null'] }
        media_count: { type: integer, description: Includes drafts }
        sort_order: { type: integer }
        status: { type: string, enum: [draft, published] }
        updated_at: { type: [string, 'null'], format: date-time }

    AlbumInput:
      type: object
      required: [title_hi, status]
      properties:
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'] }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Generated from the English title when omitted.
        cover_media_id: { type: [integer, 'null'] }
        sort_order: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, published] }

    Donation:
      type: object
      description: |
        One donation, as the register shows it. There is no public counterpart:
        every field here is behind `donations.view`.

        The amount is sent three ways on purpose. `amount_paise` is the
        authority — an integer, because a rupee total held as a float is exact
        until it is summed, which is the one operation a treasurer cares about.
        `amount_formatted` is what a person reads, grouped the Indian way
        (₹1,25,500.00, not ₹125,500.00). `amount_decimal` is what an export or a
        receipt prints. No client ever divides by a hundred.
      properties:
        id: { type: integer }
        receipt_number:
          type: [string, 'null']
          description: Null until the donation is verified; never changes afterwards.
        donor_name: { type: string }
        donor_phone: { type: [string, 'null'] }
        donor_address: { type: [string, 'null'] }
        is_anonymous:
          type: boolean
          description: >-
            The donor asked not to be named in any future listing. Their own
            receipt still names them — it is their receipt.
        amount_paise: { type: integer, minimum: 1 }
        amount_decimal: { type: string, example: '1255.00' }
        amount_formatted: { type: string, example: '₹1,25,500.50' }
        donation_date: { type: string, format: date }
        payment_mode: { type: string, enum: [cash, upi, bank_transfer, cheque, card, other] }
        reference_number: { type: [string, 'null'] }
        purpose:
          type: string
          enum: [general, puja, maintenance, festival, annadan, construction, other]
        notes: { type: [string, 'null'] }
        status: { type: string, enum: [pending, confirmed, reversed] }
        is_locked:
          type: boolean
          description: >-
            A receipt has been issued, so only `notes` may change. The client
            uses it to decide which controls to offer; the server refuses
            regardless.
        recorded_by: { type: [string, 'null'] }
        confirmed_at: { type: [string, 'null'], format: date-time }
        confirmed_by: { type: [string, 'null'] }
        reversed_at: { type: [string, 'null'], format: date-time }
        reversed_by: { type: [string, 'null'] }
        reversal_reason: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }

    DonationInput:
      type: object
      required: [donor_name, amount, donation_date, payment_mode]
      properties:
        donor_name: { type: string, maxLength: 200 }
        donor_phone: { type: [string, 'null'], maxLength: 20 }
        donor_address: { type: [string, 'null'], maxLength: 500 }
        is_anonymous: { type: boolean, default: false }
        amount:
          type: string
          description: >-
            "501", "501.50", "1,25,500" or "₹501". A string and not a number:
            parsing happens in one place on the server, and a JSON number would
            be a float.
        donation_date:
          type: string
          format: date
          description: Not in the future, and not more than a year in the past.
        payment_mode: { type: string, enum: [cash, upi, bank_transfer, cheque, card, other] }
        reference_number:
          type: [string, 'null']
          description: Required for every mode except cash.
        purpose:
          type: string
          enum: [general, puja, maintenance, festival, annadan, construction, other]
        notes: { type: [string, 'null'], maxLength: 2000 }

    DonationSummary:
      type: object
      description: >-
        Computed by the database over the whole filter, never by adding up a
        page of results.
      properties:
        total_paise: { type: integer, description: Confirmed donations only }
        total_formatted: { type: string }
        pending_paise: { type: integer }
        pending_formatted: { type: string }
        confirmed_count: { type: integer }
        pending_count: { type: integer }
        reversed_count: { type: integer }
        donor_count: { type: integer, description: Distinct payers among confirmed donations }

    PublicDonationSettings:
      type: object
      properties:
        requested_language: { type: string, enum: [hi, en] }
        upi_id: { type: [string, 'null'] }
        bank_name: { type: [string, 'null'] }
        account_name: { type: [string, 'null'] }
        account_number:
          type: [string, 'null']
          description: Exactly as the committee typed it; masking is their decision.
        ifsc: { type: [string, 'null'] }
        qr_url: { type: [string, 'null'] }
        intro: { $ref: '#/components/schemas/LocalizedText' }
        note: { $ref: '#/components/schemas/LocalizedText' }

    AdminDonationSettings:
      type: object
      properties:
        upi_id: { type: [string, 'null'] }
        bank_name: { type: [string, 'null'] }
        account_name: { type: [string, 'null'] }
        account_number: { type: [string, 'null'] }
        ifsc: { type: [string, 'null'] }
        qr_url: { type: [string, 'null'] }
        intro_hi: { type: [string, 'null'] }
        intro_en: { type: [string, 'null'] }
        note_hi: { type: [string, 'null'] }
        note_en: { type: [string, 'null'] }
        is_published: { type: boolean }
        is_publicly_visible:
          type: boolean
          description: >-
            Not the same as `is_published`: a block published with every field
            blank shows nothing, and the editor is told so before it looks like
            a bug.
        updated_at: { type: [string, 'null'], format: date-time }

    DonationSettingsInput:
      type: object
      properties:
        upi_id: { type: [string, 'null'], maxLength: 120 }
        bank_name: { type: [string, 'null'], maxLength: 150 }
        account_name: { type: [string, 'null'], maxLength: 150 }
        account_number: { type: [string, 'null'], maxLength: 60 }
        ifsc: { type: [string, 'null'], maxLength: 20 }
        qr_url: { type: [string, 'null'], format: uri }
        intro_hi: { type: [string, 'null'] }
        intro_en: { type: [string, 'null'] }
        note_hi: { type: [string, 'null'] }
        note_en: { type: [string, 'null'] }
        is_published: { type: boolean }

    EnquiryFormTicket:
      type: object
      required: [token, challenge, min_fill_seconds, expires_in_seconds, categories]
      properties:
        token: { type: string }
        challenge:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                question_hi: { type: string }
                question_en: { type: string }
          description: Null until this address has crossed the threshold.
        min_fill_seconds: { type: integer }
        expires_in_seconds: { type: integer }
        max_message_length: { type: integer }
        min_message_length: { type: integer }
        categories:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              label: { type: string, description: Bilingual, for a client that does not know the code }

    EnquiryInput:
      type: object
      required: [name, category, message, form_token]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        mobile: { type: [string, 'null'], maxLength: 20 }
        email: { type: [string, 'null'], format: email, maxLength: 190 }
        category:
          type: string
          enum: [general, puja_booking, donation, event, volunteer, suggestion, complaint, other]
        message: { type: string, minLength: 20, maxLength: 2000 }
        preferred_language: { type: string, enum: [hi, en] }
        form_token: { type: string }
        challenge_answer: { type: [string, 'null'], description: Required once the server has issued a question }
        website:
          type: string
          description: |
            The honeypot. A field no human sees; anything in it means a bot, and
            the request is answered as though it succeeded while storing
            nothing. Clients send it empty on every submission.

    EnquiryReceipt:
      type: object
      required: [reference, message]
      properties:
        reference:
          type: [string, 'null']
          example: RKT/E/2026-27/0001
          description: Null when the submission was dropped as spam.
        message: { type: string }

    Enquiry:
      type: object
      description: |
        Behind `enquiries.manage`. `submitted_ip_hash` is deliberately absent:
        it correlates abuse inside the database and identifies nobody outside
        this installation, and nothing in the inbox is improved by showing it.
      properties:
        id: { type: integer }
        reference: { type: string, example: RKT/E/2026-27/0001 }
        name: { type: string }
        mobile: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        category: { type: string }
        category_label: { type: string }
        message: { type: string }
        preferred_language:
          type: string
          enum: [hi, en]
          description: Which language the devotee asked to be **answered** in.
        status: { type: string, enum: [new, in_progress, resolved, spam] }
        is_open: { type: boolean }
        assigned_to: { type: [integer, 'null'] }
        assigned_to_name: { type: [string, 'null'] }
        resolved_at: { type: [string, 'null'], format: date-time }
        resolved_by_name: { type: [string, 'null'] }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnquirySummary:
      type: object
      properties:
        new: { type: integer }
        in_progress: { type: integer }
        resolved: { type: integer }
        spam: { type: integer }
        open: { type: integer, description: new + in_progress }

    PublicAnnouncement:
      type: object
      description: |
        A notice as a visitor sees it. Carries nothing about how it came to be
        there - no author, no status, no schedule, no record of what was sent.
      properties:
        id: { type: integer }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        message: { $ref: '#/components/schemas/LocalizedText' }
        priority: { type: string, enum: [normal, important, urgent] }
        link_url: { type: [string, 'null'] }
        ends_at:
          type: [string, 'null']
          format: date-time
          description: |
            So a page left open can drop the banner as the notice expires
            without asking the server again. `start_at` is not sent: everything
            that reaches this resource has already started.

    AnnouncementInput:
      type: object
      required: [title_hi, message_hi]
      properties:
        title_hi: { type: string, maxLength: 200 }
        title_en: { type: [string, 'null'], maxLength: 200 }
        message_hi: { type: string, maxLength: 5000 }
        message_en: { type: [string, 'null'], maxLength: 5000 }
        priority: { type: string, enum: [normal, important, urgent] }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, 'null'], format: date-time, description: Null means until it is archived }
        link_url: { type: [string, 'null'], maxLength: 500 }

    AdminAnnouncement:
      type: object
      properties:
        id: { type: integer }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        message_hi: { type: string }
        message_en: { type: [string, 'null'] }
        priority: { type: string, enum: [normal, important, urgent] }
        priority_label: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, 'null'], format: date-time }
        link_url: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published, archived] }
        is_showing:
          type: boolean
          description: Computed from the clock on every read, never stored.
        is_scheduled: { type: boolean, description: Published, but its window has not opened }
        has_expired: { type: boolean, description: Published, but its window has closed }
        was_sent: { type: boolean }
        sent_at: { type: [string, 'null'], format: date-time }
        sent_by_name: { type: [string, 'null'] }
        recipient_count:
          type: [integer, 'null']
          description: What the queue was handed. Not a delivery guarantee.
        channels:
          type: array
          items: { type: string }
        channel_labels:
          type: array
          items: { type: string }
        created_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Transaction:
      type: object
      description: |
        One ledger entry as the committee sees it. There is no public
        counterpart and there is not going to be: the public page publishes
        category totals, and this row carries who was paid.

        `attachment_path` is **absent by design** - see the attachment
        endpoint.
      properties:
        id: { type: integer }
        type: { type: string, enum: [income, expense] }
        type_label: { type: string }
        category_id: { type: integer }
        category: { $ref: '#/components/schemas/AccountingCategory' }
        amount_paise:
          type: integer
          description: The authority. Integer paise; nothing divides by a hundred but the display.
        amount_formatted: { type: string, description: '"1,25,500.00" with the rupee sign, grouped the Indian way' }
        transaction_date: { type: string, format: date }
        payment_mode: { type: string }
        payment_mode_label: { type: string }
        reference_number: { type: [string, 'null'] }
        requires_reference: { type: boolean, description: True for every mode but cash }
        payee_name: { type: [string, 'null'], description: Never public }
        description: { type: [string, 'null'], description: A working note. Never public }
        has_attachment: { type: boolean }
        attachment_name: { type: [string, 'null'] }
        attachment_size: { type: [integer, 'null'] }
        attachment_mime: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, reversed] }
        is_locked: { type: boolean, description: True once approved. Only the description may change }
        approved_at: { type: [string, 'null'], format: date-time }
        approved_by_name: { type: [string, 'null'] }
        reversed_at: { type: [string, 'null'], format: date-time }
        reversed_by_name: { type: [string, 'null'] }
        reversal_reason: { type: [string, 'null'] }
        created_by_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TransactionInput:
      type: object
      required: [amount, transaction_date, category_id, payment_mode]
      properties:
        amount:
          type: string
          description: |
            As typed - "1200", "1,200.50" and "1200" all parse. A string
            because it is parsed once, into exact paise, by the server; a
            client that parsed it too would be a second opinion about
            somebody's money.
        transaction_date: { type: string, format: date, description: Never in the future }
        category_id: { type: integer }
        type:
          type: string
          enum: [income, expense]
          description: |
            Optional. The category decides which side of the books an entry is
            on; sending one that disagrees is refused rather than silently
            corrected, because a disagreement means somebody chose wrongly.
        payment_mode: { type: string }
        reference_number: { type: [string, 'null'], description: Required for every mode but cash }
        payee_name: { type: [string, 'null'], maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }

    AccountingCategory:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        type: { type: string, enum: [income, expense] }
        type_label: { type: string }
        name_hi: { type: string }
        name_en: { type: [string, 'null'], description: Absent means absent. The read falls back to Hindi }
        description_hi: { type: [string, 'null'] }
        description_en: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }
        transaction_count:
          type: integer
          description: |
            Present when the caller asked for it. What decides whether the type
            may still be changed and whether deletion is available at all.

    AccountingCategoryInput:
      type: object
      required: [type, name_hi]
      properties:
        code: { type: [string, 'null'], maxLength: 50, description: Slugged. `donation` is reserved }
        type: { type: string, enum: [income, expense] }
        name_hi: { type: string, maxLength: 150 }
        name_en: { type: [string, 'null'], maxLength: 150 }
        description_hi: { type: [string, 'null'], maxLength: 500 }
        description_en: { type: [string, 'null'], maxLength: 500 }
        sort_order: { type: [integer, 'null'] }
        is_active: { type: [boolean, 'null'] }

    AccountsSummary:
      type: object
      description: The ledger's figures. Excludes donations, which are counted from their own register.
      properties:
        income_paise: { type: integer, description: Approved only }
        expense_paise: { type: integer, description: Approved only }
        net_paise:
          type: integer
          description: |
            Signed. A month that spent more than it received is a real month,
            and clamping at zero would hide exactly the fact a treasurer needs
            to see.
        approved_count: { type: integer }
        pending_count: { type: integer }
        pending_income_paise: { type: integer, description: Counted in no total. Reported on its own line }
        pending_expense_paise: { type: integer }
        reversed_count: { type: integer }

    AccountingSettings:
      type: object
      properties:
        is_published: { type: boolean, description: Starts false, deliberately }
        opening_balance_paise: { type: integer, description: Signed }
        opening_balance_formatted: { type: string }
        opening_balance_date: { type: [string, 'null'], format: date }
        intro_hi: { type: [string, 'null'] }
        intro_en: { type: [string, 'null'] }
        note_hi: { type: [string, 'null'] }
        note_en: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by_name: { type: [string, 'null'] }

    AccountingSettingsInput:
      type: object
      properties:
        is_published: { type: [boolean, 'null'] }
        opening_balance: { type: [string, 'null'], description: As typed, and may be negative }
        opening_balance_date: { type: [string, 'null'], format: date }
        intro_hi: { type: [string, 'null'], maxLength: 2000 }
        intro_en: { type: [string, 'null'], maxLength: 2000 }
        note_hi: { type: [string, 'null'], maxLength: 2000 }
        note_en: { type: [string, 'null'], maxLength: 2000 }

    Transparency:
      type: object
      description: |
        What the temple has published about its accounts. `is_published` false
        is a value, not a failure - and it comes with **no summary block at
        all**, not a set of zeros.
      properties:
        is_published: { type: boolean }
        intro: { $ref: '#/components/schemas/LocalizedText' }
        note: { $ref: '#/components/schemas/LocalizedText' }
        opening_balance_date: { type: [string, 'null'], format: date }
        available_years:
          type: array
          description: |
            Newest first. The current financial year is always offered, even
            while empty, and is always first: a page that quietly showed last
            year because this one has no entries yet would put one year's
            heading over another year's figures.
          items:
            type: object
            properties:
              year: { type: integer }
              label: { type: string, description: '"2026-27"' }
        summary: { $ref: '#/components/schemas/TransparencyYear' }

    TransparencyYear:
      type: object
      description: One financial year, April to March. Every figure is a SUM over a filtered query.
      properties:
        year: { type: integer }
        year_label: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        opening_balance_paise:
          type: integer
          description: |
            The stated opening balance plus everything approved before this
            year began. Computed, never stored, so a correction to an old entry
            cannot leave last year's closing and this year's opening
            disagreeing.
        donations_paise:
          type: integer
          description: |
            Confirmed donations, read from the donation register. Reported
            separately from other income so a reader can see which is which and
            check each against its own source.
        other_income_paise: { type: integer, description: Approved income transactions }
        total_income_paise: { type: integer }
        total_expense_paise: { type: integer }
        closing_balance_paise: { type: integer }
        donation_count:
          type: integer
          description: A count, never a name. No donor is identified anywhere in this response.
        income_by_category:
          type: array
          items: { $ref: '#/components/schemas/CategoryTotal' }
        expense_by_category:
          type: array
          description: Largest first. A heading with nothing against it is omitted rather than listed at zero.
          items: { $ref: '#/components/schemas/CategoryTotal' }
        as_of: { type: string, format: date-time }

    CategoryTotal:
      type: object
      properties:
        code: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        total_paise: { type: integer }

    ReportCatalogue:
      type: object
      properties:
        reports:
          type: array
          description: Only what this account may run.
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              description: { type: string }
              has_personal_columns:
                type: boolean
                description: Whether the report *has* such columns, so a screen can offer the switch.
              may_see_personal:
                type: boolean
                description: Whether this account may turn that switch on.
        may_export: { type: boolean, description: Reading and downloading are separate permissions }
        formats:
          type: array
          items: { type: string, enum: [csv, xlsx, pdf] }
        export_limit: { type: integer }

    Report:
      type: object
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        filters:
          type: array
          description: The filters this run was made under, in words - the same sentence the file's header block carries.
          items: { type: string }
        includes_personal: { type: boolean }
        has_personal_columns: { type: boolean }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ReportColumn' }
        rows:
          type: array
          description: |
            One object per row, keyed by column. A money cell is
            `{paise, display}`; everything else is a string or null. A personal
            column that was not disclosed is **absent from the object**.
          items: { type: object, additionalProperties: true }
        summary:
          type: array
          items: { $ref: '#/components/schemas/ReportFigure' }

    ReportColumn:
      type: object
      properties:
        key: { type: string }
        label: { type: string, description: In the requested language }
        type: { type: string, enum: [text, money, number, date, datetime] }
        personal:
          type: boolean
          description: |
            True for a column naming a person. Such a column only appears at all
            when it was asked for and allowed - so this flag describes what
            arrived, never what was withheld.

    ReportFigure:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string }
        value: { description: The raw figure - integer paise for money }
        display: { type: string, description: What a person reads }

    Overview:
      type: object
      description: |
        Every block below is optional, and its absence means "this account may
        not see it" rather than "it is zero".
      properties:
        financial_year:
          type: object
          properties:
            year: { type: integer }
            label: { type: string }
        money:
          type: object
          description: Needs `accounts.view`.
          properties:
            donations_paise: { type: integer }
            other_income_paise: { type: integer }
            total_income_paise: { type: integer }
            total_expense_paise: { type: integer }
            closing_balance_paise: { type: integer }
            donation_count: { type: integer }
            donations_display: { type: string }
            total_income_display: { type: string }
            total_expense_display: { type: string }
            closing_balance_display: { type: string }
        donation_trend:
          type: array
          description: Needs `donations.view`. Twelve months, oldest first, including the empty ones.
          items:
            type: object
            properties:
              month: { type: string, description: 'YYYY-MM' }
              label: { type: string }
              total_paise: { type: integer }
              display: { type: string }
        enquiries:
          type: object
          description: Needs `enquiries.manage`.
          properties:
            new: { type: integer }
            in_progress: { type: integer }
            open: { type: integer }
        upcoming_events:
          type: array
          description: Needs `content.view`. Cancelled occurrences are listed and flagged, never dropped.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              time: { type: string }
              title: { type: string }
              is_cancelled: { type: boolean }

security:
  - sessionCookie: []
