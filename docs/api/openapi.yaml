openapi: 3.1.0

info:
  title: Radha Krishna Thakurbari API
  version: 0.11.1
  description: |
    REST/JSON API for the Radha Krishna Thakurbari Flutter Web public site and
    admin console.

    **Scope: Phases 0-10.** Phases 11 and 12 add no new endpoints of their own;
    anything they do add must be documented here in the same change that
    implements it.

    ## Authorization

    Admin endpoints require an authenticated, active account **and** a
    permission key from the matrix (`module.action`, e.g. `users.manage`).
    `GET /api/auth/me` returns the caller's effective keys so the client can
    hide what would be refused — a courtesy only. Every request is authorized
    again on the server.

    Super Admin passes every check and its permission set cannot be edited, so
    no change to the matrix can leave the temple without an administrator.

    ## Bilingual content

    Public content endpoints take `?lang=hi|en` and answer with resolved text
    blocks rather than raw columns:

    ```json
    { "value": "…", "language": "hi", "fallback_used": true }
    ```

    Hindi is the source language. When the requested language has no value the
    Hindi one is served and `fallback_used` is true, so the client can tell the
    visitor instead of silently showing the wrong language. Neither stored
    language is ever merged or overwritten.

    ## Envelope

    Every response uses one of two shapes.

    Success:
    ```json
    { "success": true, "data": {}, "meta": null }
    ```
    Error:
    ```json
    { "success": false, "error": { "code": "…", "message": "…", "details": {} } }
    ```

    ## Authentication

    Browser clients use Sanctum stateful (cookie/session) authentication:

    1. `GET /sanctum/csrf-cookie` — sets the `XSRF-TOKEN` cookie.
    2. `POST /api/auth/login` — sets the HttpOnly session cookie.
    3. Every subsequent unsafe request echoes the cookie value in the
       `X-XSRF-TOKEN` header.

    The session cookie is HttpOnly, so no credential is readable from browser
    storage. The client must send credentials with every request
    (`withCredentials`), and the API's CORS allow-list must name the exact
    frontend origin.

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.thakurbari.example
    description: Production (placeholder)

tags:
  - name: System
  - name: Authentication
  - name: Public content
  - name: Admin
  - name: Content management
  - name: User management
  - name: Roles and permissions
  - name: Temple profile
  - name: Committee
  - name: Events
  - name: Enquiries
    description: |
      The public contact form and the committee's inbox. The form is the
      only endpoint an anonymous request can write with; the inbox is
      readable only with `enquiries.manage`, and an enquiry reaches no
      public endpoint at any status.
  - name: Announcements
    description: |
      Notices for the website, and sending them. Publishing and sending are
      separate acts on separate endpoints: an unpublished notice is invisible
      and fixable, a sent one is gone.
  - name: Accounts
    description: |
      The temple's books, and what is published from them. Only approved money
      is counted anywhere; the public endpoint carries totals and no person's
      name; and there is no DELETE on a transaction, because reversal - which
      keeps the row, its bill and a stated reason - is the only undo.
  - name: Reports
    description: |
      The standard reports, the files made from them, and the dashboard's
      figures. Everything here is a GET; nothing in this module writes. The
      export runs the same report with the same filters as the screen, and
      personal columns are absent unless they were both permitted and asked
      for.

paths:
  /api/health:
    get:
      tags: [System]
      summary: Liveness and configuration probe
      security: []
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Health'

  /sanctum/csrf-cookie:
    get:
      tags: [Authentication]
      summary: Issue the CSRF cookie
      description: Must be called before the first unsafe request from a browser.
      security: []
      responses:
        '204':
          description: Cookie issued

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Rate limited to 5 attempts per minute per e-mail + IP.

        Credentials are verified before account status, so an unknown address and
        a wrong password are indistinguishable to the caller.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 191
                password:
                  type: string
                  minLength: 8
                  maxLength: 255
                remember:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_INACTIVE or ACCOUNT_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: TOO_MANY_REQUESTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out and invalidate the session
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: The signed-in user
      description: |
        Used by the Flutter client to restore a session on page load or refresh.
        Returns 403 when the account has been deactivated or blocked since the
        session began.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_INACTIVE or ACCOUNT_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset link
      description: |
        Always answers 200 with the same message, whether or not the address is
        registered, so the endpoint cannot be used to enumerate accounts. A link
        is only ever mailed to an active account. Rate limited to 3 requests per
        minute per e-mail + IP.

        The reset form itself is delivered in Phase 2.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 191 }
      responses:
        '200':
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
        '422':
          description: VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: TOO_MANY_REQUESTS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/admin/ping:
    get:
      tags: [Admin]
      summary: Protected-group probe
      description: |
        Proves that the admin route group is closed on the server. Replaced by
        the real dashboard endpoints in Phase 2.
      responses:
        '200':
          description: Reachable by an authenticated, active user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          user: { $ref: '#/components/schemas/User' }
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: ACCOUNT_INACTIVE or ACCOUNT_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/public/pages/{slug}:
    get:
      tags: [Public content]
      summary: A published CMS page
      description: |
        Only published pages are reachable. A draft and an unknown slug both
        return 404 with the same body, so a draft cannot be detected.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [hi, en], default: hi }
      responses:
        '200':
          description: The page, resolved for the requested language
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicPage' }
        '404':
          description: NOT_FOUND - unknown slug, or the page is a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/public/site-settings:
    get:
      tags: [Public content]
      summary: Site-wide content and the public navigation menu
      description: |
        Answers on a freshly installed site too, with empty values, so the client
        can render its empty states rather than an error.
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          schema: { type: string, enum: [hi, en], default: hi }
      responses:
        '200':
          description: Settings, contact block and visible navigation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicSiteSettings' }

  /api/admin/pages:
    get:
      tags: [Content management]
      summary: Every page including drafts
      description: Requires the `manage-content` ability (Super Admin, Admin, Content Manager).
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Paginated list, using the shared pagination meta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminPage' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN, ACCOUNT_INACTIVE or ACCOUNT_BLOCKED }

  /api/admin/pages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Content management]
      summary: One page with both languages raw
      description: No fallback is applied, so the editor can see that English is empty.
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminPage' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Content management]
      summary: Update a page
      description: |
        Hindi fields are required; English fields are optional and a blank one is
        stored as absent, which is what the fallback rule keys on.

        `slug` is not accepted - it is the page's public URL. `published_at` is
        stamped by the server on the first draft-to-published transition and is
        never moved or cleared afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_hi, content_hi, status]
              properties:
                title_hi: { type: string, maxLength: 200 }
                title_en: { type: [string, 'null'], maxLength: 200 }
                content_hi: { type: string, maxLength: 100000 }
                content_en: { type: [string, 'null'], maxLength: 100000 }
                meta_title_hi: { type: [string, 'null'], maxLength: 200 }
                meta_title_en: { type: [string, 'null'], maxLength: 200 }
                meta_description_hi: { type: [string, 'null'], maxLength: 320 }
                meta_description_en: { type: [string, 'null'], maxLength: 320 }
                status: { type: string, enum: [draft, published] }
      responses:
        '200':
          description: The updated page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminPage' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }

  /api/admin/site-settings:
    get:
      tags: [Content management]
      summary: Settings and the full navigation menu, both languages raw
      responses:
        '200':
          description: Settings including hidden navigation items
        '403': { description: FORBIDDEN }
    put:
      tags: [Content management]
      summary: Update settings, and optionally replace the navigation menu
      description: |
        Every settings field is optional. When `navigation` is present it
        **replaces** the entire menu inside a transaction; omit it to leave the
        menu untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagline_hi: { type: [string, 'null'], maxLength: 200 }
                tagline_en: { type: [string, 'null'], maxLength: 200 }
                footer_text_hi: { type: [string, 'null'], maxLength: 400 }
                footer_text_en: { type: [string, 'null'], maxLength: 400 }
                # The postal address is **not** here. Phase 3 moved it to the
                # temple profile, and the form request rejects it as unknown
                # input rather than storing a second copy of where the temple
                # is. Use PUT /api/admin/temple-profile.
                contact_phone: { type: [string, 'null'] }
                contact_email: { type: [string, 'null'], format: email }
                social_links:
                  type: object
                  additionalProperties: { type: string, format: uri }
                navigation:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [label_hi, route]
                    properties:
                      label_hi: { type: string, maxLength: 120 }
                      label_en: { type: [string, 'null'], maxLength: 120 }
                      route: { type: string, maxLength: 300 }
                      sort_order: { type: integer, minimum: 0 }
                      is_visible: { type: boolean, default: true }
      responses:
        '200': { description: The updated settings and menu }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Complete a password reset
      description: |
        Finishes the flow the forgot-password endpoint starts. An invalid,
        expired or already-used token is refused with the same generic message,
        so the endpoint cannot be used to probe which tokens exist. A successful
        reset rotates the remember token, ending other sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200': { description: Password changed }
        '422': { description: VALIDATION_FAILED - weak password, or invalid/expired token }
        '429': { description: TOO_MANY_REQUESTS }

  /api/admin/users:
    get:
      tags: [User management]
      summary: List committee accounts
      description: Requires `users.view`.
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, blocked] } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUser' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { description: FORBIDDEN }
    post:
      tags: [User management]
      summary: Create a committee account
      description: |
        Requires `users.manage`. **No password is accepted**: the account is
        stored with an unusable hash and a reset link is mailed, so a plaintext
        password never passes through the committee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, role_id]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: [string, 'null'], maxLength: 100 }
                email: { type: string, format: email, maxLength: 191 }
                mobile: { type: [string, 'null'], maxLength: 20 }
                role_id: { type: integer, description: Must be an active role }
                status: { type: string, enum: [active, inactive, blocked], default: active }
      responses:
        '201':
          description: Account created and a reset link sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminUser' }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - duplicate e-mail, unknown or inactive role }

  /api/admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [User management]
      summary: One account
      description: Requires `users.view`.
      responses:
        '200': { description: The account }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [User management]
      summary: Update an account
      description: |
        Requires `users.manage`. Four refusals protect the administration itself
        and all surface as 422 against the named field:

        * the last active Super Admin cannot be demoted (`role_id`);
        * the last active Super Admin cannot be deactivated or blocked (`status`);
        * you cannot change your own role (`role_id`);
        * you cannot deactivate or block your own account (`status`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, email, role_id, status]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: [string, 'null'], maxLength: 100 }
                email: { type: string, format: email }
                mobile: { type: [string, 'null'], maxLength: 20 }
                role_id: { type: integer }
                status: { type: string, enum: [active, inactive, blocked] }
      responses:
        '200': { description: The updated account }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED, including the four safety refusals }

  /api/admin/users/{id}/login-history:
    get:
      tags: [User management]
      summary: Sign-in history for one account
      description: |
        Requires `security.view` — deliberately a different key from
        `users.manage`, so administering accounts and reading who tried to sign
        in to them can be granted separately. Records successes **and** failures.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated attempts, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LoginAttempt' }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '403': { description: FORBIDDEN }

  /api/admin/users/{id}/send-password-reset:
    post:
      tags: [User management]
      summary: Re-send a password reset link
      description: Requires `users.manage`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Link sent }
        '403': { description: FORBIDDEN }

  /api/admin/roles:
    get:
      tags: [Roles and permissions]
      summary: Roles with their effective permissions
      description: |
        Requires `roles.view`. Super Admin is reported with the whole catalogue
        and `is_editable: false`.
      responses:
        '200':
          description: The roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ManagedRole' }
        '403': { description: FORBIDDEN }

  /api/admin/permissions:
    get:
      tags: [Roles and permissions]
      summary: The permission catalogue, grouped by module
      description: |
        Requires `roles.view`. Includes keys for modules that later phases build;
        `phase` says which, so the UI can mark a toggle as not yet enforced.
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          modules:
                            type: array
                            items: { $ref: '#/components/schemas/PermissionModule' }
        '403': { description: FORBIDDEN }

  /api/admin/roles/{id}/permissions:
    put:
      tags: [Roles and permissions]
      summary: Replace a role's permission set
      description: |
        Requires `roles.manage`. Unknown keys are rejected **by name** rather
        than stored, and Super Admin cannot be restricted at all.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  maxItems: 100
                  items: { type: string, example: content.manage }
      responses:
        '200': { description: The updated role }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - unknown keys, or an attempt to restrict Super Admin }

  /api/public/temple-profile:
    get:
      tags: [Temple profile]
      summary: The temple's public identity
      description: |
        Authoritative for the temple's name and postal address. The Flutter
        client renders its header, hero, footer and page titles from `name`
        here, falling back to the application shell string only while this
        request is in flight.

        Always answers, even on a freshly installed site: an unconfigured
        temple returns empty values so the site shows its empty states rather
        than an error.
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicTempleProfile' }

  /api/public/committee:
    get:
      tags: [Committee]
      summary: The management committee
      description: |
        Published, currently-serving members only — the filter is in the query,
        not the serializer, so an unpublished member cannot leak through a
        presentation mistake. A member whose `tenure_end` has passed drops off
        this list while their record is kept for the committee.

        **Personal details are consent-gated.** `phone`, `email` and
        `photo_url` are **omitted entirely** unless the member's consent is on
        record *and* that specific detail is cleared for publication. An absent
        key is the contract: it is never sent as null.
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
      responses:
        '200':
          description: The committee, in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicCommitteeMember' }

  /api/admin/temple-profile:
    get:
      tags: [Temple profile]
      summary: The profile with both languages raw
      description: Requires `content.view`.
      responses:
        '200': { description: The profile }
        '403': { description: FORBIDDEN }
    put:
      tags: [Temple profile]
      summary: Update the temple profile
      description: |
        Requires `temple.manage`. Every field is optional: the committee fills
        the temple's details in over time and a half-configured profile must
        still save.

        `logo_url` and `map_url` are URLs rather than uploads; file handling
        with its own MIME and size validation is Phase 5.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TempleProfileInput' }
      responses:
        '200': { description: The updated profile }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/committee-members:
    get:
      tags: [Committee]
      summary: Every committee member
      description: |
        Requires `content.view`. Includes unpublished members and those whose
        term has ended — committee membership is village history and is not
        lost when a term ends. Personal details are present here: consent
        governs *publication*, not administration.
      responses:
        '200':
          description: The members, in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminCommitteeMember' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Committee]
      summary: Add a committee member
      description: |
        Requires `temple.manage`. A new member is unpublished and unconsented
        unless the request says otherwise: publishing a person is a decision
        somebody has to make on purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitteeMemberInput' }
      responses:
        '201': { description: The member }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - including a visibility flag set without consent }

  /api/admin/committee-members/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Committee]
      summary: One member, raw
      description: Requires `content.view`.
      responses:
        '200': { description: The member }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Committee]
      summary: Update a member
      description: |
        Requires `temple.manage`. Two refusals surface as 422 against the named
        field:

        * a `show_*_publicly` flag set while `has_consent` is false;
        * `tenure_end` earlier than `tenure_start`.

        Setting `has_consent` to false clears all three visibility flags in the
        same transaction, so a stale `true` cannot survive a withdrawal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitteeMemberInput' }
      responses:
        '200': { description: The updated member }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Committee]
      summary: Remove a member permanently
      description: |
        Requires `temple.manage`. This is **erasure**, distinct from ending a
        tenure: setting `tenure_end` retires somebody while keeping the record.
        Deletion exists because a person may ask for their personal data to be
        removed.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /api/public/events:
    get:
      tags: [Events]
      summary: The calendar, as dated occurrences
      description: |
        Returns **occurrences**, not stored rows. A recurring event is stored
        once as a rule — "the aarti, daily, at 18:30" — and expanded here across
        the requested window, so the daily aarti is one record and appears every
        day.

        Drafts are excluded in the query, never in the serializer. Cancelled
        events **are** returned, flagged with `is_cancelled`: silently dropping
        a cancelled festival would leave devotees who planned around it finding
        nothing and assuming the site was broken.

        The window is bounded (`days`, default 90, maximum 366) and each event
        contributes at most 366 occurrences, so an indefinite daily rule cannot
        produce an unbounded response.
      security: []
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
        - name: view
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
          description: |
            `upcoming` returns occurrences that have not finished, soonest
            first — a festival that began yesterday and ends tomorrow has not
            been missed. `past` returns finished occurrences, most recent first.
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 90 } }
        - { name: featured, in: query, schema: { type: boolean }, description: A cancelled event is never featured. }
        - { name: type, in: query, schema: { type: string, enum: [aarti, bhajan_kirtan, festival, puja, community_service, other] }, description: An unrecognised value is ignored rather than refused. }
      responses:
        '200':
          description: The occurrences
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventOccurrence' }
                      meta:
                        type: object
                        properties:
                          view: { type: string, enum: [upcoming, past] }
                          timezone: { type: string, example: Asia/Kolkata }
                          count: { type: integer }

  /api/public/events/{id}:
    get:
      tags: [Events]
      summary: One event and its next occurrences
      description: |
        A draft is indistinguishable from an event that does not exist: both are
        404. `on` names the occurrence the visitor arrived at, so a shared link
        to "the aarti on the 12th" still opens on the 12th.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: lang, in: query, schema: { type: string, enum: [hi, en], default: hi } }
        - { name: on, in: query, schema: { type: string, format: date }, description: Which occurrence to open on. }
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          event: { $ref: '#/components/schemas/EventOccurrence' }
                          occurrences:
                            type: array
                            items: { $ref: '#/components/schemas/EventOccurrence' }
        '404': { description: NOT_FOUND - unknown, or still a draft }

  /api/admin/events:
    get:
      tags: [Events]
      summary: Every event, including drafts and past ones
      description: |
        Requires `content.view`. The calendar is a record as well as a schedule,
        so nothing is filtered out by default. A repeating event appears once —
        it is the rule, not the dates it produces.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published, cancelled] } }
      responses:
        '200':
          description: The events, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminEvent' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Events]
      summary: Add an event
      description: Requires `events.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201': { description: The event }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Events]
      summary: One event, raw
      description: Requires `content.view`.
      responses:
        '200': { description: The event }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Events]
      summary: Update an event
      description: |
        Requires `events.manage`. Two refusals surface as 422 against the named
        field: `end_at` earlier than `start_at`, and `recurrence_until` earlier
        than the first occurrence.

        Setting `status` to `cancelled` clears `is_featured` — a cancelled event
        is never promoted on the home page. `recurrence_days` is cleared for any
        rule other than `weekly`, and a weekly rule with no days adopts the
        weekday the event starts on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200': { description: The updated event }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Events]
      summary: Remove an event permanently
      description: |
        Requires `events.manage`. Distinct from cancelling: setting the status
        to `cancelled` keeps the record and tells devotees the event is off.
        Deletion is for entries created by mistake.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  # --- Gallery and video darshan (Phase 5) ----------------------------------

  /api/public/media:
    get:
      tags: [Media]
      summary: The published gallery, paginated
      security: []
      description: |
        Published items only, filtered in the query rather than the serializer.
        The response is **paginated**: an unbounded gallery is a
        denial-of-service against this API, and worse here than elsewhere
        because every row carries three image URLs.

        `per_page` defaults to 24 and is capped at 60. Ordering is the
        committee's arrangement (`sort_order`) and then newest first, so
        anything unarranged still appears somewhere sensible.

        An `album` slug that names an **unpublished** album returns nothing: the
        album is the arrangement the committee has not finished.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
        - { name: type, in: query, schema: { type: string, enum: [photo, video] } }
        - { name: album, in: query, schema: { type: string }, description: Album slug }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
      responses:
        '200':
          description: One page of the gallery
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicMedia' }
                      meta: { $ref: '#/components/schemas/PageMeta' }

  /api/public/media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: One published gallery item
      security: []
      description: A draft is indistinguishable from an item that does not exist.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicMedia' }
        '404': { description: NOT_FOUND }

  /api/public/albums:
    get:
      tags: [Media]
      summary: Published albums with their covers
      security: []
      description: |
        `media_count` is the number of **published** photographs in the album —
        deliberately a different number from the one the library shows an
        editor, which includes drafts.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicAlbum' }

  /api/admin/media:
    get:
      tags: [Media]
      summary: The whole library, including drafts
      description: Requires `content.view`, so a Viewer can see it without changing it.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published] } }
        - { name: type, in: query, schema: { type: string, enum: [photo, video] } }
        - { name: album, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Every item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMedia' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Media]
      summary: Upload a photograph (multipart)
      description: |
        Requires `media.manage`, and rate-limited separately
        (`throttle:media-upload`, 30/minute): this is the only endpoint that
        consumes disk.

        The file is validated **by its bytes**, never by its name or the
        declared `Content-Type`:

        1. size, against `media.max_upload_kb` (default 8 MB);
        2. the MIME the server detects, against an allow-list of
           `image/jpeg`, `image/png`, `image/webp` — no GIF, no SVG;
        3. that the bytes decode as an image of that type, within bounds.

        It is then **re-encoded**, which is the metadata strip: EXIF (including
        GPS), XMP, IPTC, colour profiles and anything appended to the file are
        not carried across, because nothing is copied. The same pass writes up
        to three responsive variants (480 / 1080 / 1920 px on the longest edge);
        an image smaller than a bound is never upscaled and simply has fewer
        variants. The original is not kept.

        A refused upload leaves neither a row nor a file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title_hi, status]
              properties:
                file: { type: string, format: binary }
                title_hi: { type: string, maxLength: 200 }
                title_en: { type: [string, 'null'], maxLength: 200 }
                caption_hi: { type: [string, 'null'] }
                caption_en: { type: [string, 'null'] }
                album_id: { type: [integer, 'null'] }
                sort_order: { type: [integer, 'null'] }
                status: { type: string, enum: [draft, published] }
      responses:
        '201':
          description: The stored item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminMedia' }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED — the refusal is against `file` }
        '429': { description: TOO_MANY_REQUESTS }
        '500': { description: SERVER_ERROR — image processing unavailable on this host }

  /api/admin/media/video:
    post:
      tags: [Media]
      summary: Link a video (nothing is uploaded)
      description: |
        Requires `media.manage`. Only YouTube links are accepted, and what is
        stored is the extracted **video id**, not the URL that was typed: an
        arbitrary embed source out of an admin form is a stored-XSS vector.
        Tracking parameters are therefore dropped, and the canonical URL and
        the `youtube-nocookie` embed URL are both rebuilt from the id.

        Video files are not hosted: a ten-minute aarti recording is hundreds of
        megabytes, and village shared hosting has neither the disk nor the
        outbound bandwidth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_url, title_hi, status]
              properties:
                external_url: { type: string, format: uri }
                thumbnail_url: { type: [string, 'null'], format: uri }
                title_hi: { type: string, maxLength: 200 }
                title_en: { type: [string, 'null'] }
                caption_hi: { type: [string, 'null'] }
                caption_en: { type: [string, 'null'] }
                album_id: { type: [integer, 'null'] }
                status: { type: string, enum: [draft, published] }
      responses:
        '201': { description: The stored item }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED — not a YouTube video link }

  /api/admin/media/reorder:
    post:
      tags: [Media]
      summary: Apply a new gallery arrangement
      description: |
        Requires `media.manage`. The **whole** ordering is sent rather than one
        move, and applied in one transaction, so a dropped request leaves the
        previous arrangement intact rather than half of a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 500
                  items: { type: integer }
      responses:
        '200': { description: Order updated }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: One item, raw
      description: Requires `content.view`.
      responses:
        '200': { description: The item }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Media]
      summary: Edit titles, captions, album, order and status
      description: |
        Requires `media.manage`.

        The stored **file cannot be replaced**. Every reference to a photograph
        on this site is by URL, so swapping the bytes under a URL would silently
        change a page, an event poster and a committee portrait at once.
        Uploading a new item and repointing the reference is visible; replacing
        bytes in place is not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaInput' }
      responses:
        '200': { description: The updated item }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Media]
      summary: Delete an item and its stored files
      description: |
        Requires `media.manage`.

        **Refused with 409 `MEDIA_IN_USE`** while anything on the site still
        points at the file: the temple logo, a committee member's photograph, an
        event poster, an album cover, or a page whose body embeds the URL. The
        error names the referring records, because "cannot delete" with no
        reason is a dead end for a committee member who cannot read the
        database. Unpublishing is always available instead.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409':
          description: MEDIA_IN_USE
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          details:
                            type: object
                            properties:
                              references:
                                type: array
                                items: { $ref: '#/components/schemas/MediaReference' }

  /api/admin/media/{id}/references:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: What would block deleting this item
      description: |
        Requires `content.view`. Asked *before* offering a delete button, so a
        blocked deletion is explained rather than attempted and refused.
      responses:
        '200':
          description: The references, and whether deletion is possible
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          can_delete: { type: boolean }
                          references:
                            type: array
                            items: { $ref: '#/components/schemas/MediaReference' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /api/admin/albums:
    get:
      tags: [Media]
      summary: Albums, with counts that include drafts
      description: Requires `content.view`.
      responses:
        '200':
          description: The albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminAlbum' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Media]
      summary: Create an album
      description: |
        Requires `media.manage`. `slug` is optional: a Hindi-only title
        transliterates to nothing usable, so the server generates a unique slug
        rather than letting two albums collide on an empty string.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumInput' }
      responses:
        '201': { description: The album }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/albums/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Media]
      summary: One album
      description: Requires `content.view`.
      responses:
        '200': { description: The album }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Media]
      summary: Update an album
      description: Requires `media.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlbumInput' }
      responses:
        '200': { description: The updated album }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED }
    delete:
      tags: [Media]
      summary: Remove an album, keeping its photographs
      description: |
        Requires `media.manage`. Deliberately **not** a cascade: an album is an
        arrangement, and losing an arrangement must never lose the content. Its
        photographs survive, unfiled.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  # --- Donations and receipts (Phase 6) -------------------------------------

  /api/public/donation-settings:
    get:
      tags: [Donations]
      summary: Where devotees may send money
      security: []
      description: |
        The **whole** public donation surface. There is no list, no count, no
        total and no donor: donor detail reaches no public endpoint at any
        status, in any aggregate. Aggregate transparency is Phase 9, which is a
        separate requirement with its own consent question.

        `data` is `null` — a success, not an error — when the committee has not
        published anything, or has published a block with nothing payable in it.
        An empty box on the public page reads as a broken site rather than an
        unconfigured one.

        `account_number` is returned **exactly as the committee typed it**.
        Whether to mask it, and how, is their decision and their bank's policy.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The published details, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/PublicDonationSettings'
                          - type: 'null'

  /api/admin/donations:
    get:
      tags: [Donations]
      summary: The donation register, paginated, with its totals
      description: |
        Requires `donations.view`. A Content Manager holds neither donation key
        and is refused: the specification says they cannot see sensitive
        financial detail.

        `meta.summary` carries the count and total for the **whole filter**,
        computed by the database over confirmed donations — not by adding up the
        page in view, which would report the total of one page as the total of
        everything. The status filter is deliberately ignored by the summary, so
        the register does not say "received: ₹0.00" to somebody looking at the
        pending tab.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, reversed] } }
        - { name: mode, in: query, schema: { type: string, enum: [cash, upi, bank_transfer, cheque, card, other] } }
        - { name: purpose, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string }, description: Donor name, receipt number or payment reference }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: One page of the register
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Donation' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              summary: { $ref: '#/components/schemas/DonationSummary' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Donations]
      summary: Record a donation
      description: |
        Requires `donations.manage`. The donation is recorded as **pending**
        with no receipt number: a number is issued only on verification, so
        every number that exists corresponds to a receipt that was really given.

        `amount` is a **string** — "501", "501.50", "1,25,500" or "₹501" — and
        is parsed into integer paise in exactly one place on the server. A JSON
        number would be a float, and a rupee total that is exact until it is
        summed is not exact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationInput' }
      responses:
        '201': { description: The recorded donation }
        '403': { description: FORBIDDEN }
        '422':
          description: |
            VALIDATION_FAILED — the amount is not a positive sum, the date is in
            the future or absurdly past, or a non-cash donation arrived without
            the reference the treasurer needs to match it to a statement.

  /api/admin/donations/summary:
    get:
      tags: [Donations]
      summary: Count and total for a filter, without the rows
      description: Requires `donations.view`.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: mode, in: query, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string } }
      responses:
        '200':
          description: The totals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DonationSummary' }
        '403': { description: FORBIDDEN }

  /api/admin/donations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Donations]
      summary: One donation, with who recorded, verified and reversed it
      description: Requires `donations.view`.
      responses:
        '200': { description: The donation }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Donations]
      summary: Correct a donation
      description: |
        Requires `donations.manage`.

        **Once a receipt has been issued only `notes` may change.** Changing the
        amount, the date, the payer or the mode after a receipt is in somebody's
        hand would make the paper and the database disagree, so anything else is
        refused with 409 `DONATION_LOCKED` and a message saying to reverse and
        record again — which is how a receipt book works, and which leaves both
        the mistake and the correction visible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationInput' }
      responses:
        '200': { description: The updated donation }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409': { description: DONATION_LOCKED }
        '422': { description: VALIDATION_FAILED }

  /api/admin/donations/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Donations]
      summary: Verify a donation and issue its receipt number
      description: |
        Requires `donations.manage`. This is the moment a receipt number comes
        into existence, and it never changes afterwards.

        The number is `PREFIX/FY/NNNN` — `RKT/2026-27/0001` — where the
        financial year runs April to March and comes from the **donation's own
        date**, so confirming a March donation in April does not move it into
        next year's book. Uniqueness is guaranteed by a unique index rather than
        by the application's arithmetic: two treasurers confirming at the same
        instant both read the same highest sequence, and only the index can stop
        them.
      responses:
        '200': { description: The confirmed donation, with its receipt number }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409': { description: DONATION_LOCKED — already confirmed, or reversed }

  /api/admin/donations/{id}/reverse:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Donations]
      summary: Reverse a donation — the only undo there is
      description: |
        Requires `donations.manage`.

        **There is no `DELETE` on any donation endpoint**, at any status. Its
        absence is the rule. Reversal keeps the row and its receipt number,
        stops it counting towards every total, and records who reversed it,
        when, and why.

        The reason is required: "why was five thousand rupees removed from the
        books" is the first question an auditor asks, and the answer must not
        depend on somebody's memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reversal_reason]
              properties:
                reversal_reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: The reversed donation }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '409': { description: DONATION_LOCKED — already reversed }
        '422': { description: VALIDATION_FAILED — no reason given }

  /api/admin/donations/{id}/receipt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Donations]
      summary: The printable receipt
      description: |
        Requires `donations.view`. Returns **HTML**, not JSON and not a PDF: a
        print-ready document the committee opens in a tab and prints, to paper
        or to PDF.

        The reason is Devanagari. A donor is `श्री रामप्रसाद यादव`, and rendering
        that means reordering matras and forming conjuncts. `dompdf` and the
        FPDF family do not shape complex scripts and would print the letters in
        the wrong order, on a receipt for money. Every browser ships a shaping
        engine and a PDF writer.

        A reversed donation prints as **CANCELLED**, in the largest type on the
        page, with its reason.

        Served `Cache-Control: no-store, private`: a receipt names a donor and
        must not sit in a proxy, or in the cache of a shared computer after it
        is handed back.
      responses:
        '200':
          description: A print-ready HTML document
          content:
            text/html:
              schema: { type: string }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /api/admin/donation-settings:
    get:
      tags: [Donations]
      summary: The published bank/UPI block, as the editor sees it
      description: Requires `donations.view`.
      responses:
        '200':
          description: The details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminDonationSettings' }
        '403': { description: FORBIDDEN }
    put:
      tags: [Donations]
      summary: Change where devotees send money
      description: |
        Requires **`donations.manage`**, not `content.manage`.

        Changing the published UPI id is the single most valuable attack on this
        site, so the control sits behind the money permission: a compromised
        Content Manager account can rewrite the About page and cannot redirect
        the temple's donations.

        `qr_url` comes from the Phase 5 media library, and the Phase 5 deletion
        guard knows about it — a QR code the donation page is showing cannot be
        deleted out from under it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationSettingsInput' }
      responses:
        '200': { description: The updated details }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/public/enquiry-form:
    get:
      tags: [Enquiries]
      summary: The ticket the contact form must be submitted with
      description: |
        Public. Issues an HMAC-signed, single-use token stamped with its issue
        time, plus - once this address has crossed the submission threshold -
        a small bilingual arithmetic question that must be answered with the
        message ("CAPTCHA-after-threshold").

        The expected answer never leaves the server: the token is a signed
        nonce and the state lives server-side, which also lets the ticket be
        **spent once**. One harvested token is worth one message.

        No third-party CAPTCHA is used. reCAPTCHA and hCaptcha would each
        fingerprint every villager who opens the temple's contact page with a
        third party, and both need keys this project has not been given.
      responses:
        '200':
          description: A form ticket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EnquiryFormTicket' }

  /api/public/enquiries:
    post:
      tags: [Enquiries]
      summary: Send a message to the temple
      description: |
        Public, and the only endpoint in this API an anonymous request can
        **write** with. Four layers of protection, none of them a third-party
        service: an IP rate limit (3/minute) with a daily ceiling on top, a
        honeypot field, the timed single-use form ticket, and the question
        after the threshold.

        A honeypot hit returns the **success shape with a null reference** and
        stores nothing: telling a bot it was detected is free tuning feedback
        for whoever wrote it.

        The response carries a reference number and a sentence, and **nothing
        else** - never the stored row. Echoing the submission back would make
        this endpoint a reflector.

        At least one of `mobile` or `email` is required: an enquiry nobody can
        answer is not an enquiry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryInput' }
      responses:
        '201':
          description: Accepted - the reference, or null when dropped as spam
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EnquiryReceipt' }
        '422':
          description: |
            VALIDATION_FAILED, ENQUIRY_FORM_EXPIRED (missing, forged, spent or
            stale ticket, or filled in faster than a person could type), or
            ENQUIRY_CHALLENGE_REQUIRED.
        '429': { description: TOO_MANY_REQUESTS - per-minute limit or the daily ceiling }

  /api/admin/enquiries:
    get:
      tags: [Enquiries]
      summary: The committee's inbox
      description: |
        Requires **`enquiries.manage`** - the read as well as the write. There
        is deliberately no `enquiries.view` tier: a Viewer may see the calendar
        and the donation totals, but a villager's telephone number and their
        complaint are not general committee reading.

        Unanswered messages sort first, then newest first, so paging cannot
        reshuffle what still needs doing. `spam` is excluded unless asked for
        by name.

        `submitted_ip_hash` is never serialized. It exists to correlate abuse
        inside the database, not to be read.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, in_progress, resolved, spam] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: assigned_to, in: query, schema: { type: string }, description: A user id, or `unassigned` }
        - { name: search, in: query, schema: { type: string }, description: Reference, name, mobile, e-mail or message }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: One page of enquiries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Enquiry' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }

  /api/admin/enquiries/summary:
    get:
      tags: [Enquiries]
      summary: How many are waiting, by status
      description: |
        Requires `enquiries.manage`. Counted by the database over the whole
        inbox rather than over a page, and with the `status` filter dropped - a
        summary that honoured it would report "new: 0" to somebody looking at
        the resolved tab.
      responses:
        '200':
          description: Counts by status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EnquirySummary' }
        '403': { description: FORBIDDEN }

  /api/admin/enquiries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Enquiries]
      summary: One enquiry
      description: |
        Requires `enquiries.manage`. There is **no public counterpart and no
        DELETE**: `spam` takes a row out of the inbox and keeps it, because a
        complaint its subject can erase is not a complaint.
      responses:
        '200':
          description: The enquiry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Enquiry' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }

  /api/admin/enquiries/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Enquiries]
      summary: Move an enquiry along, or hand it to somebody
      description: |
        Requires `enquiries.manage`.

        `resolved_at` is stamped on entering `resolved` and cleared on leaving
        it, so the column always answers "when was this closed" rather than
        "when was it last touched". Resolving an already resolved enquiry keeps
        the original closing time.

        `assigned_to` is validated against **active users who hold
        `enquiries.manage`**: assigning an enquiry to a Treasurer, who cannot
        open the inbox, is a silent black hole.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [new, in_progress, resolved, spam] }
                assigned_to: { type: [integer, 'null'] }
      responses:
        '200': { description: The updated enquiry }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
        '422': { description: VALIDATION_FAILED - including an assignee who cannot open the inbox }

  /api/public/announcements:
    get:
      tags: [Announcements]
      summary: The temple's current notices
      description: |
        Public. Returns only announcements that are **published and inside
        their window** - `start_at <= now` and `end_at` either null or in the
        future.

        That filter is a `where` clause, not a serializer decision. If it lived
        in the serializer then "scheduled for next Tuesday" would be a display
        convention, and the first caller to hit this endpoint directly would
        read next week's news.

        No scheduler is involved. `status` is what a person decided; whether a
        notice is showing is computed from the clock on every request, because a
        status flipped by cron goes live only if cron is installed - and on
        modest hosting it may not be.

        Loudest first: urgent, then important, then normal. The list is small
        and bounded; the client shows one.

        Carries the notice and nothing about how it came to be there - no
        author, no status, no schedule, no record of what was sent.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The notices currently showing
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicAnnouncement' }

  /api/admin/announcements:
    get:
      tags: [Announcements]
      summary: Every notice the committee has written
      description: |
        Requires `content.view`, as for the calendar and the gallery. Archived
        notices are excluded unless `include_archived` is set - kept, not
        deleted.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
        - { name: priority, in: query, schema: { type: string, enum: [normal, important, urgent] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: include_archived, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: One page of announcements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminAnnouncement' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
    post:
      tags: [Announcements]
      summary: Write a notice
      description: |
        Requires `announcements.manage`. The result is a **draft**: this shows
        nothing on the website and sends nothing to anybody.

        `status`, `channels` and everything about sending are ignored if they
        appear in the payload. Publishing and sending are decisions with their
        own endpoints, not fields a request can reach by naming them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201': { description: The new draft }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - including a window that ends before it starts }

  /api/admin/announcements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Announcements]
      summary: One notice, as the editor loads it
      description: |
        Requires `content.view`. Both languages are returned raw: a resolved
        value with the Hindi fallback applied would make an empty English field
        look filled in, and the next save would write the Hindi into it.
      responses:
        '200':
          description: The announcement
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminAnnouncement' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Announcements]
      summary: Correct a notice
      description: Requires `announcements.manage`. Sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200': { description: The updated announcement }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/announcements/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Announcements]
      summary: Put a notice on the website
      description: |
        Requires `announcements.manage`. Puts the notice on the website for its
        window - and **sends nothing**. Publishing and sending are two different
        acts with two different undos.
      responses:
        '200': { description: The published announcement }
        '403': { description: FORBIDDEN }

  /api/admin/announcements/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Announcements]
      summary: Take a notice off the website
      description: |
        Requires `announcements.manage`. Keeps the row, including whatever
        record of sending it carries. There is **no DELETE**.
      responses:
        '200': { description: The archived announcement }
        '403': { description: FORBIDDEN }

  /api/admin/announcements/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Announcements]
      summary: Send a notice - once
      description: |
        Requires `announcements.manage`. **The only irreversible operation in
        this API.**

        `channels` is required and must not be empty. There is no default,
        deliberately: the specification's rule is "no sends without explicit
        admin action", and a default channel would mean the most consequential
        action here could happen without anybody choosing it.

        E-mail goes to **active committee accounts and nobody else**. There is
        no subscriber list, and the addresses that exist must not become one: a
        villager who left an e-mail on an enquiry gave it to get an answer to
        their question.

        SMS and WhatsApp are known codes but are refused until a provider has
        been approved and configured, with a message that says so - a channel
        that appears to send and quietly does nothing is worse than none.

        `recipient_count` records what the queue was handed. It is not a
        delivery guarantee, which no mail system can offer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                channels:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [site, email, sms, whatsapp]
      responses:
        '200': { description: The sent announcement, with sent_at and recipient_count }
        '403': { description: FORBIDDEN }
        '409':
          description: |
            ANNOUNCEMENT_ALREADY_SENT - a message cannot be unsent, so a second
            attempt is refused; or ANNOUNCEMENT_NOT_PUBLISHED.
        '422': { description: VALIDATION_FAILED - no channel chosen, or one with no provider }

  /api/public/transparency:
    get:
      tags: [Accounts]
      summary: What the temple did with the money
      description: |
        Public, and **aggregates only**. No individual transaction and no
        person's name is reachable here at any status - not a donor, not a
        payee, not a supplier. Category totals answer the question a villager
        actually asks and identify nobody.

        Only **approved** money is counted. Pending is unchecked and reversed
        is cancelled; neither appears in any figure, at any granularity.

        **Donated income is read from the donation register, not the ledger.**
        A donation entered in both places would be published at twice its
        value, so the two sources are separate and are reported as separate
        lines. The `donation` category code is reserved and refused on a
        hand-entered transaction, which makes the rule structural rather than
        advisory.

        When the committee has not published its books, `is_published` is false
        and there is **no `summary` block at all** - not a set of zeros. Zeros
        would read as "the temple received nothing", which is a false statement
        about somebody's finances rather than a missing feature.

        A year that is out of range or has no records is answered with the
        current financial year rather than an error: a stale bookmark should
        show this year's accounts, not a fault page.
      parameters:
        - { name: year, in: query, schema: { type: integer }, description: 'The April a financial year starts in: 2026 means 2026-27. Defaults to the current one.' }
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The published figures, or a statement that there are none
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Transparency' }

  /api/admin/transactions:
    get:
      tags: [Accounts]
      summary: The ledger
      description: Requires `accounts.view`. A Content Manager holds neither accounts key and is refused.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, reversed] } }
        - { name: type, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: mode, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string }, description: Matches a payee, a description or a reference }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: One page of the ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }
    post:
      tags: [Accounts]
      summary: Record one movement of money
      description: |
        Requires `accounts.manage`. The result is **pending**: counted in no
        total, public or admin, until somebody approves it.

        `status` and everything about approval are ignored if they appear in
        the payload. Approving is a decision with its own endpoint, not a field
        a request can reach by naming it.

        Accepts `multipart/form-data` when a bill is attached. The file's type
        is decided by **reading its bytes**, never by its name or the browser's
        `Content-Type`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/TransactionInput'
                - type: object
                  properties:
                    attachment: { type: string, format: binary }
      responses:
        '201': { description: The new pending entry }
        '403': { description: FORBIDDEN }
        '422':
          description: |
            VALIDATION_FAILED - an amount that is not positive or not readable,
            a date in the future, a missing reference on a non-cash entry, an
            inactive category, a category on the other side of the books, a
            file whose bytes are not an accepted type, or the reserved
            `donation` category.

  /api/admin/transactions/summary:
    get:
      tags: [Accounts]
      summary: The running figures for a filter
      description: |
        Requires `accounts.view`. The same filters as the list **minus the
        status**: a summary that honoured it would report "spent: 0" whenever
        the reader happened to be looking at the pending tab.

        Approved money only, computed by the database over the whole filter -
        never by adding up a page. Pending money is reported on its own lines,
        named as pending.

        These figures are the **ledger's**, and exclude donations, which are
        counted from their own register. The client says so on the screen, or a
        committee reads the wrong number out at a meeting.
      responses:
        '200':
          description: The figures
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccountsSummary' }
        '403': { description: FORBIDDEN }

  /api/admin/transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Accounts]
      summary: One entry, with who recorded, approved and reversed it
      description: Requires `accounts.view`.
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Transaction' }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND }
    put:
      tags: [Accounts]
      summary: Correct an entry
      description: |
        Requires `accounts.manage`. **Once approved, only `description` may
        change** - the figure has been counted in a total the village reads, and
        editing it silently would leave the page and the books disagreeing with
        no trace of which changed. Anything else is 409, with a message saying
        to reverse and record again.

        The bill on an approved entry cannot be replaced either: it is the
        evidence for a published figure, not a note.
      responses:
        '200': { description: The updated entry }
        '403': { description: FORBIDDEN }
        '409': { description: TRANSACTION_LOCKED }
        '422': { description: VALIDATION_FAILED }

  /api/admin/transactions/{id}/attachment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Accounts]
      summary: The bill
      description: |
        Requires **`accounts.view`**, not `accounts.manage`: a Viewer auditing
        the books needs to see the evidence, which is the entire reason for
        attaching it.

        Streams the bytes from a private disk. The specification's column is
        named `attachment_url`; it is stored as a path and **never serialized**,
        so there is no URL for a client to build, leak in a screenshot or find
        in a browser history. Sent as `Content-Disposition: attachment` with
        `X-Content-Type-Options: nosniff`, so nothing that got past the byte
        check can execute in the admin session's origin.
      responses:
        '200': { description: The file }
        '403': { description: FORBIDDEN }
        '404': { description: NOT_FOUND - there is no bill on this entry }

  /api/admin/transactions/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Accounts]
      summary: Check an entry, and count it
      description: |
        Requires `accounts.manage`. From here the figure is in every total,
        including the one the village reads, and the row is locked to
        everything but its description.

        Refused with 409 if the entry is already approved, or has been
        reversed. Refused as well when `ACCOUNTS_REQUIRE_SECOND_APPROVER` is on
        and the approver is the person who recorded it - off by default,
        because a temple with one treasurer would be deadlocked on day one and
        would share a login instead, which is worse than no control at all.
      responses:
        '200': { description: The approved entry }
        '403': { description: FORBIDDEN }
        '409': { description: TRANSACTION_LOCKED }

  /api/admin/transactions/{id}/reverse:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Accounts]
      summary: The only undo
      description: |
        Requires `accounts.manage`. The row stays, keeps its bill, and stops
        counting towards every total.

        `reversal_reason` is **required and has no default**. This is the only
        undo in the phase, the row stays in the books afterwards, and the reason
        is the entire explanation of why a figure that was once counted no
        longer is. A default would put the same sentence on every reversal in
        the temple's history.

        **There is no DELETE anywhere in this module.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reversal_reason]
              properties:
                reversal_reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: The reversed entry }
        '403': { description: FORBIDDEN }
        '409': { description: TRANSACTION_LOCKED - already reversed }
        '422': { description: VALIDATION_FAILED - no reason given }

  /api/admin/accounting-categories:
    get:
      tags: [Accounts]
      summary: The headings the books are filed under
      description: Requires `accounts.view`. Carries the usage count, which decides what may still be done to each.
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [income, expense] } }
        - { name: active_only, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Every heading, active first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AccountingCategory' }
        '403': { description: FORBIDDEN }
    post:
      tags: [Accounts]
      summary: Write a heading
      description: |
        Requires `accounts.manage`. The code `donation` is **reserved** and
        refused: donated income is counted from the donation register, and a
        heading by that name is an invitation to count it twice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingCategoryInput' }
      responses:
        '201': { description: The new heading }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED - including the reserved code }

  /api/admin/accounting-categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [Accounts]
      summary: Correct a heading
      description: |
        Requires `accounts.manage`. **The `type` and `code` of a heading that
        has been used are ignored**, not obeyed: flipping a heading from expense
        to income would move every historical entry filed under it to the other
        side of the books, silently, in figures the village has already read.
      responses:
        '200': { description: The updated heading }
        '403': { description: FORBIDDEN }
    delete:
      tags: [Accounts]
      summary: Remove an unused heading
      description: |
        Requires `accounts.manage`. This is the **only DELETE in Phases 6-9**,
        and it is narrow: a heading nothing is filed under is a mistyped
        heading, not history.

        One that has been used is refused with a message naming the count and
        offering deactivation instead - which stops it being offered on new
        entries and leaves every old one still readable. The database says the
        same thing one layer down, via `restrictOnDelete`.
      responses:
        '204': { description: Removed }
        '403': { description: FORBIDDEN }
        '409': { description: TRANSACTION_LOCKED - entries are filed under it }

  /api/admin/accounting-settings:
    get:
      tags: [Accounts]
      summary: Whether the books are public, and where they start
      description: Requires `accounts.view`.
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AccountingSettings' }
        '403': { description: FORBIDDEN }
    put:
      tags: [Accounts]
      summary: Publish the books, or set the opening balance
      description: |
        Requires **`accounts.manage`**, behind the money permission for the same
        reason the bank details are: a compromised content account must not be
        able to publish, unpublish or restate the temple's accounts.

        `is_published` starts **false**. A ledger that publishes itself the
        moment the first row is saved is only ever built by accident;
        half-entered books are not transparency, they are a misstatement with
        the temple's name on it.

        `opening_balance` may be negative - a temple that begins in deficit
        should be able to say so rather than rounding its own history up to
        zero. Without it, the published balance is short by exactly whatever was
        in the cash box on the day the books were started here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingSettingsInput' }
      responses:
        '200': { description: The updated settings }
        '403': { description: FORBIDDEN }
        '422': { description: VALIDATION_FAILED }

  /api/admin/reports:
    get:
      tags: [Reports]
      summary: The report catalogue
      description: |
        Requires `reports.view`. Lists **only the reports this account may
        actually run**: each report declares the module key it reads on top of
        `reports.view`, and the server filters the list, so the console is never
        offered a door that will not open. A courtesy, never the access control
        - every other endpoint checks again.

        Also says whether this account may download at all. Reading and
        downloading are separate permissions: a Viewer may read a report on
        screen and not take a copy away.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: What this account may run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReportCatalogue' }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN }

  /api/admin/reports/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, enum: [donations, donation-summary, income-expenditure, ledger, events, enquiries] } }
    get:
      tags: [Reports]
      summary: Run a report
      description: |
        Requires `reports.view` **and** the report's own key. A report that is
        not listed in the catalogue is a 403 here rather than a 404: pretending
        it is absent would be obscurity standing in for a permission.

        ## The period

        `year` names an Indian financial year - `2026` is 2026-27 - and is the
        ordinary way to ask. `from`/`to` are for a month or a festival week and
        override it. **When neither is given the report covers the current
        financial year**, not all of history: an unbounded first click is a scan
        of every row the temple has ever recorded.

        ## Personal columns

        `include_personal` defaults to **false**, and while it is false those
        columns are **absent from the response** - not blank, not masked. A
        masked column is still a column somebody can widen.

        Asking for them without the permission is **refused**, not answered with
        a quietly narrower payload: silently dropping columns somebody asked for
        is how a treasurer concludes the report is broken.

        Money travels as both the integer paise and a formatted string. The
        paise are the authority; only the server divides by a hundred.
      parameters:
        - { name: year, in: query, schema: { type: integer }, description: 'The April a financial year starts in' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: purpose, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: include_personal, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403':
          description: |
            FORBIDDEN - the account may not run this report; or
            REPORT_DISCLOSURE_REFUSED - it may run it, but not with its personal
            columns.
        '404': { description: NOT_FOUND }

  /api/admin/reports/{key}/export:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [Reports]
      summary: A report as a file
      description: |
        Requires `reports.export` on top of everything the report itself needs.

        **The file is the screen.** This endpoint takes the *same* query string
        as the report above, parses it with the *same* code and runs the *same*
        report; the only difference is that paging is dropped, because a file is
        the whole filter rather than the page somebody happened to be looking
        at. The client never uploads rows to be exported, so "the export applies
        exactly the on-screen filters" is a property of the code.

        Three formats:

        * **`csv`** - UTF-8 **with a byte-order mark**, because without one
          Excel on Windows opens it as Windows-1252 and every Hindi name becomes
          mojibake. CRLF line endings. A cell beginning `=`, `+`, `-`, `@`, tab
          or carriage return is prefixed with an apostrophe: a donor recorded as
          `=HYPERLINK(...)` is an attack carried out by the reader's own
          spreadsheet. Money is a plain decimal - the rupee sign would make the
          column text and every total would silently fail.
        * **`xlsx`** - a real workbook, written directly with `ZipArchive`
          rather than by adding a library. Numbers are numbers, so a column can
          be summed.
        * **`pdf`** - a **print-ready HTML document**, served inline. No PHP PDF
          library shapes Devanagari; every browser does, and the person
          exporting already has one open. Ctrl-P, "Save as PDF".

        Every file carries a header block: the temple, the report, **the filters
        applied**, when it was made and by whom - and, when it contains personal
        data, a line saying so.

        Capped at 10,000 rows. When the cap bites the file says so on itself
        rather than being quietly short.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx, pdf], default: csv } }
        - { name: include_personal, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: |
            The file. `csv` and `xlsx` as `Content-Disposition: attachment` with
            a dated name; `pdf` inline, to be printed. All three carry
            `X-Content-Type-Options: nosniff` and `Cache-Control: private,
            no-store`.
        '403':
          description: |
            FORBIDDEN - this account may read reports but not download them; or
            REPORT_DISCLOSURE_REFUSED.
        '422': { description: VALIDATION_FAILED - an unknown format }

  /api/admin/overview:
    get:
      tags: [Reports]
      summary: The dashboard's figures
      description: |
        Requires `reports.view`, and then **each panel is gated again by the
        module it reads**: money by `accounts.view`, the donation trend by
        `donations.view`, the inbox count by `enquiries.manage`, the calendar by
        `content.view`.

        A panel this account may not see is **absent from the response**, not
        zero. An absent panel says "not yours"; an empty one says "the temple
        received nothing", and only one of those is true.

        The money comes from the same service as the public transparency page
        and the income & expenditure statement, so the three cannot disagree.

        The trend carries **twelve months including the empty ones**: a chart
        that omitted them would compress the gap and show a steady trickle where
        there was a festival and then silence.
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [hi, en] } }
      responses:
        '200':
          description: What this account may see of it
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Overview' }
        '403': { description: FORBIDDEN }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: radha_krishna_thakurbari_session
      description: HttpOnly session cookie issued by the login endpoint.

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta:
          oneOf:
            - $ref: '#/components/schemas/PageMeta'
            - type: 'null'

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code; mirrored by the Flutter client.
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - ACCOUNT_INACTIVE
                - ACCOUNT_BLOCKED
                - FORBIDDEN
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - TOO_MANY_REQUESTS
                - CSRF_TOKEN_MISMATCH
                - MEDIA_IN_USE
                - DONATION_LOCKED
                - SERVER_ERROR
            message:
              type: string
              description: Human-readable detail. Clients render their own localized text.
            details:
              type: object
              description: Field-keyed validation messages, or extra context.
              additionalProperties:
                type: array
                items: { type: string }

    PageMeta:
      type: object
      description: Pagination convention, reused by every paginated endpoint.
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        has_more: { type: boolean }

    Role:
      type: object
      properties:
        id: { type: integer }
        slug:
          type: string
          enum: [super-admin, admin, treasurer, content-manager, viewer]
        name: { type: string }

    User:
      type: object
      description: The password hash and remember token are never exposed.
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: [string, 'null'] }
        full_name: { type: string }
        email: { type: string, format: email }
        mobile: { type: [string, 'null'] }
        status:
          type: string
          enum: [active, inactive, blocked]
        last_login_at: { type: [string, 'null'], format: date-time }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: >
            The caller's effective permission keys. The client uses these to hide
            actions the server would refuse; it is never the access control.
          items: { type: string }

    LocalizedText:
      type: object
      description: |
        One piece of bilingual content resolved for the requested language.
        `language` is what was actually served, which may differ from what was
        asked for; `fallback_used` says so explicitly.
      properties:
        value: { type: [string, 'null'] }
        language: { type: string, enum: [hi, en] }
        fallback_used: { type: boolean }

    PublicPage:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        requested_language: { type: string, enum: [hi, en] }
        title: { $ref: '#/components/schemas/LocalizedText' }
        content: { $ref: '#/components/schemas/LocalizedText' }
        meta_title: { $ref: '#/components/schemas/LocalizedText' }
        meta_description: { $ref: '#/components/schemas/LocalizedText' }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    AdminPage:
      type: object
      description: Both languages raw, no fallback applied. Admin surface only.
      properties:
        id: { type: integer }
        slug: { type: string }
        title_hi: { type: string }
        title_en: { type: [string, 'null'] }
        content_hi: { type: string }
        content_en: { type: [string, 'null'] }
        meta_title_hi: { type: [string, 'null'] }
        meta_title_en: { type: [string, 'null'] }
        meta_description_hi: { type: [string, 'null'] }
        meta_description_en: { type: [string, 'null'] }
        status: { type: string, enum: [draft, published] }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    NavigationItem:
      type: object
      properties:
        id: { type: integer }
        label: { $ref: '#/components/schemas/LocalizedText' }
        route: { type: string, description: Internal path such as /about, or an absolute URL }
        sort_order: { type: integer }

    PublicSiteSettings:
      type: object
      properties:
        requested_language: { type: string, enum: [hi, en] }
        tagline: { $ref: '#/components/schemas/LocalizedText' }
        footer_text: { $ref: '#/components/schemas/LocalizedText' }
        contact:
          type: object
          description: |
            How to reach the committee. The postal address is **not** here:
            Phase 3 moved it to `GET /api/public/temple-profile`, which is now
            the only source of truth for where the temple is.
          properties:
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            map_url: { type: [string, 'null'] }
        social_links:
          type: object
          additionalProperties: { type: string }
        default_meta_title: { $ref: '#/components/schemas/LocalizedText' }
        default_meta_description: { $ref: '#/components/schemas/LocalizedText' }
        navigation:
          type: array
          items: { $ref: '#/components/schemas/NavigationItem' }

    AdminUser:
      type: object
      description: The password hash is never exposed.
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: [string, 'null'] }
        full_name: { type: string }
        email: { type: string, format: email }
        mobile: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive, blocked] }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        role: { $ref: '#/components/schemas/Role' }

    ManagedRole:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive] }
        permissions:
          type: array
          items: { type: string }
        is_editable:
          type: boolean
          description: False for Super Admin, whose set is computed and fixed.
        user_count: { type: [integer, 'null'] }

    PermissionModule:
      type: object
      properties:
        module: { type: string }
        label: { type: string }
        phase:
          type: integer
          description: The phase that builds this module; keys beyond the delivered phases are grantable but not yet enforced.
        permissions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }

    LoginAttempt:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        outcome:
          type: string
          enum: [success, invalid_credentials, inactive, blocked]
        successful: { type: boolean }
        ip_address: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    TempleAddress:
      type: object
      description: |
        The temple's postal address, **already resolved for the requested
        language**. Authoritative since Phase 3.

        Each part is stored in both scripts and resolved here rather than sent
        as `*_hi`/`*_en` pairs: the address is read as one block of lines, and a
        client assembling it would be re-implementing the fallback rule. An
        unwritten English part falls back to the Hindi one, part by part, so a
        half-translated address still reads as an address rather than as gaps.

        `postal_code` is not bilingual - `813204` is `813204` in either
        language.
      properties:
        address_line1: { type: [string, 'null'] }
        address_line2: { type: [string, 'null'] }
        village: { type: [string, 'null'] }
        panchayat: { type: [string, 'null'] }
        police_station: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        postal_code: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        map_url: { type: [string, 'null'] }

    PublicTempleProfile:
      type: object
      properties:
        requested_language: { type: string, enum: [hi, en] }
